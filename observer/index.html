<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="每日观察">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f1e8">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' https://api.github.com https://open.bigmodel.cn; media-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>每日观察</title>
<style>
/* ============================================================
   每日观察 v2
   依据：《陪考手记》第 12 章四件工具 + 2026-09 证据调研
   - 回忆练习 g≈0.6（Adesope 2017）→ 错题逐题记录，按 2/7/21 天排「盖住答案重做」
   - 有把握却做错的题改正后最牢（Metcalfe 2017）→ 每道错题记信心，优先重做
   - 学生自我监控 g=0.47 → 孩子自己计时自己填，家长只问一句
   - 初中家长干涉型参与与数学成绩负相关（Patall 2008 / 2023 meta）→ 不做家长批改打分
   - 深圳 2026 中考 630 分结构 → 默认满分、提分空间按中考权重算
   视觉：观察笔记本。纸色底 + 墨色字，错题用琥珀不用红——它是待返回的线索，不是审判。
   ============================================================ */
:root{
  --bg:#f5f1e8; --surface:#fffdf8; --surface2:#efe9dc; --surface3:#f8f4ec;
  --ink:#2b2621; --ink2:#6e665c; --ink3:#a0978a; --line:#e4dccd;
  --accent:#2f5d8a; --accent-bg:#e4ecf4;
  --amber:#a8681a; --amber-bg:#f7ead5;
  --good:#3d7a5c; --good-bg:#e1efe6;
  --danger:#a8423a;
  --shadow:0 1px 2px rgba(60,45,20,.05),0 4px 14px rgba(60,45,20,.05);
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:16px; --tabh:62px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#171614; --surface:#211f1c; --surface2:#2d2a26; --surface3:#1c1a18;
  --ink:#ece6db; --ink2:#b1a898; --ink3:#7d7568; --line:#38342f;
  --accent:#8cb4dc; --accent-bg:#233142;
  --amber:#e0a656; --amber-bg:#3a2e1d;
  --good:#7fc39f; --good-bg:#1f3328;
  --danger:#e08078; --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
body{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 20px)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

#top{position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:880px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:.02em}
.term{font-size:13px;color:var(--ink2)}
.syncst{margin-left:auto;font-size:12px;color:var(--ink3);white-space:nowrap;border:0;background:transparent;padding:4px 0}
.syncst.err{color:var(--amber)}
.demo-banner{background:var(--amber-bg);color:var(--amber);font-size:13px;text-align:center;padding:6px 16px}

main{max-width:880px;margin:0 auto;padding:16px}
h2{font-family:var(--serif);font-size:23px;margin:2px 0 4px;letter-spacing:.01em}
h3{font-family:var(--serif);font-size:17px;margin:0 0 8px}
.sub{color:var(--ink2);font-size:14px;margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:0 16px}
.cols>*{min-width:0}
.redo .row a.small{display:inline-flex;align-items:center;min-height:44px}
.redo a.small.faint{color:var(--ink2)}
.segrow .btn{min-height:44px}
@media (min-width:760px){.cols{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}

.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;line-height:1.2;min-height:34px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.soft.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:14px;min-height:36px;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg.sm button{padding:4px 9px;min-height:30px;font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-size:15px;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary,.btn.good{color:#10161d}}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.sm{padding:5px 10px;min-height:34px;font-size:14px}
input[type=text],input[type=number],input[type=date],input[type=password],textarea,select{width:100%;border:1px solid var(--line);background:var(--surface3);border-radius:10px;padding:9px 11px;font-size:16px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:var(--surface)}
textarea{min-height:64px;resize:vertical;line-height:1.5}
label.f{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface3)}
.stepper button{border:0;background:transparent;width:38px;height:38px;font-size:20px;line-height:1;color:var(--ink2)}
.stepper .v{min-width:44px;text-align:center;font-family:var(--mono);font-size:16px}
.minin{width:84px !important;text-align:center;font-family:var(--mono);font-size:18px !important;padding:7px 8px !important}
.timein{width:136px !important;min-width:136px;padding:7px 8px !important;font-family:var(--mono)}
.tip{background:var(--accent-bg);border-radius:var(--r);padding:12px 14px;font-size:14px;margin-bottom:12px}
.tip b{color:var(--accent)}
.signal{background:var(--amber-bg);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14.5px}
.signal.good{background:var(--good-bg)}
.signal.info{background:var(--surface2)}
.signal .k{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--amber);display:block;margin-bottom:2px}
.signal.good .k{color:var(--good)} .signal.info .k{color:var(--ink2)}
.empty{color:var(--ink3);font-size:14px;padding:18px 4px;text-align:center}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.accent{background:var(--accent-bg);color:var(--accent)}
.pill.good{background:var(--good-bg);color:var(--good)}

/* 首页 hero */
.hero{padding:14px 16px 12px}
.hero-top{display:flex;align-items:center;gap:8px}
.hero .d{font-family:var(--serif);font-size:24px;font-weight:700;line-height:1.2;white-space:nowrap}
.hero .w{color:var(--ink2);font-size:13px}
.navbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;color:var(--ink2);flex:none}
.navbtn:disabled{opacity:.3}
.rhythm{text-align:right;line-height:1.1}
.rhythm b{font-family:var(--mono);font-size:26px;color:var(--accent)}
.rhythm span{display:block;font-size:11.5px;color:var(--ink3)}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wstrip button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink3);padding:2px 0}
.wstrip i{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--mono);font-size:12px;color:var(--ink2)}
.wstrip .rec i{background:var(--accent-bg);border-color:var(--accent-bg);color:var(--accent)}
.wstrip .sel i{border-color:var(--ink);border-width:2px}
.wstrip .fut{opacity:.35}
.examform input.aifill{background:var(--amber-bg);border-color:var(--amber)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:108px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:left;color:var(--ink);text-decoration:none}
.tile .tn{font-weight:700;font-size:17px;display:flex;align-items:center;gap:6px}
.tile.due{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tbadge{font-style:normal;font-size:11px;font-weight:600;background:var(--accent);color:var(--surface);border-radius:10px;padding:1px 7px}
.tile .ts{font-size:15px;color:var(--accent);font-weight:600}
.tile .tu{font-size:12.5px;color:var(--ink3);margin-top:auto}
.btn.primary-soft{background:var(--accent-bg);color:var(--accent);border-color:var(--accent);font-weight:600}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:420px}
.heat .hh{font-size:11px;color:var(--ink3);text-align:center}
.hc{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:6px;font-size:12px;color:var(--ink3);background:var(--surface2)}
.hc.l1{background:var(--good-bg);color:var(--ink2)}
.hc.l2{background:var(--good);opacity:.55;color:var(--surface)}
.hc.l3{background:var(--good);color:var(--surface)}
.hc.lr{background:var(--amber-bg);color:var(--amber)}
.hc.lf{background:transparent;color:var(--ink3);opacity:.5}
.hc.now{outline:2px solid var(--accent);outline-offset:1px}
.hc.key{display:inline-block;width:12px;height:12px;aspect-ratio:auto;vertical-align:-2px;margin:0 2px 0 6px}
.sumk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sk .v{font-family:var(--mono);font-size:28px;font-weight:700;line-height:1.1}
.sk .v small{font-size:13px;font-weight:400;color:var(--ink2);margin-left:2px}
.sk .l{font-size:13px;color:var(--ink2);margin-top:4px}
.todo{padding:4px 0}
.todo-r{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;background:none;border:0;border-top:1px solid var(--line);text-align:left;font-size:17px;color:var(--ink)}
.todo-r:first-child{border-top:0}
.todo-r .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;flex:none}
.todo-r.done .ck{background:var(--good);border-color:var(--good)}
.todo-r.done .t{color:var(--ink3)}
.todo-r.next .ck{border-color:var(--accent)}
.todo-r .t{font-weight:600;flex:1}
.todo-r .s{font-size:14px;color:var(--ink2)}
.todo-r .chev{color:var(--ink3);font-size:20px}
.tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:-4px 0 14px}
.tools .btn{color:var(--ink2);flex:1;background:var(--surface);border:1px solid var(--line)}
.streak{border:0;flex-shrink:0;margin-left:8px;vertical-align:1px;font-size:13px;color:var(--amber);background:var(--amber-bg);border-radius:20px;padding:4px 10px;white-space:nowrap}
.streak b{font-family:var(--mono);font-size:16px}
details.more{margin:6px 0 14px}
details.more>summary{cursor:pointer;color:var(--accent);font-size:15px;padding:10px 4px;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:'▸ '}
details.more[open]>summary::before{content:'▾ '}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:2px;min-height:74px;box-shadow:var(--shadow)}
.step .n{font-size:12px;color:var(--ink3)}
.step .t{font-weight:600;font-size:14.5px}
.step .s{font-size:12.5px;color:var(--ink2)}
.step.done{background:var(--good-bg);border-color:transparent;box-shadow:none}
.step.done .s{color:var(--good)}

/* 科目列表 */
.slist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
.slist-h{padding:12px 16px 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sr{border-top:1px solid var(--line)}
.sr-h{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 16px;min-height:58px;cursor:pointer}
.sr-name{font-weight:600;font-size:16.5px;min-width:3em}
.sr-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
.sr-min{font-family:var(--mono);font-size:15px;min-width:38px;text-align:right}
.sr.none .sr-name,.sr.none .sr-min{color:var(--ink3)}
.sr.open{background:var(--surface3)}
.sr-body{padding:2px 16px 16px}
.sr .line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.sr .lab{font-size:13px;color:var(--ink2);width:64px;flex:none}
@media (max-width:520px){.sr .lab{width:100%}}
.tbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--accent)}
.tbtn svg{width:16px;height:16px;fill:currentColor}
.tbtn.run{background:var(--accent);border-color:var(--accent);color:#fff}
.timerbar{display:flex;align-items:center;gap:8px;background:var(--accent-bg);border-radius:12px;padding:8px 10px}
.timerbar .clock{font-family:var(--mono);font-size:22px;color:var(--accent);min-width:78px}
.addrow{display:flex;gap:6px;flex-wrap:wrap}
.addrow button{border:1px dashed var(--ink3);background:var(--surface);border-radius:10px;padding:7px 11px;font-size:14px;min-height:38px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.item .it{font-size:13px;font-weight:600;white-space:nowrap}
.item input{padding:6px 9px;font-size:15px}
.item .cf{grid-column:1/-1}
.x{border:0;background:transparent;color:var(--ink3);font-size:20px;width:32px;height:32px}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink2);font-size:12.5px;white-space:nowrap}
td:first-child{white-space:nowrap}
td.wrap{min-width:140px}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}

.wk{display:grid;grid-template-columns:52px repeat(7,1fr) 62px;gap:3px;font-size:12.5px}
.wk .hd{color:var(--ink3);text-align:center;padding:2px 0}
.wk .sn{display:flex;align-items:center;gap:5px;font-weight:600;font-size:13px;overflow:hidden;white-space:nowrap}
.wk .c{position:relative;height:34px;border-radius:6px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);color:var(--ink)}
.wk .c.blank{background:transparent;color:var(--ink3)}
.wk .c .intr{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.wk .c .e{position:absolute;bottom:1px;right:4px;font-size:9.5px;color:var(--amber);font-weight:600}
.wk .tot{text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink2);display:flex;flex-direction:column;justify-content:center;line-height:1.25}

.redo{border-left:4px solid var(--line)}
.redo.sure{border-left-color:var(--amber)}
.redo .q{font-family:var(--serif);font-size:18px;margin:8px 0 4px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:var(--mono);font-size:24px;line-height:1.2}
.kpi span{font-size:12.5px;color:var(--ink2)}

.exam-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.exam-name{font-weight:700;font-size:16px}
.tag{font-size:12px;border-radius:6px;padding:1px 7px;background:var(--surface2);color:var(--ink2)}
.tag.big{background:var(--accent-bg);color:var(--accent)}
.scores{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sc{border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:13.5px;display:flex;align-items:baseline;gap:5px}
.sc .v{font-family:var(--mono);font-size:15px;font-weight:600}
.up{color:var(--good)} .down{color:var(--amber)}
.examform .srow{display:grid;grid-template-columns:52px 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.exgrid{display:grid;grid-template-columns:1fr;column-gap:16px}
@media (min-width:640px){.exgrid{grid-template-columns:1fr 1fr}}
.exgrid .fulli{display:none;width:70px} .exgrid.showfull .fulli{display:block} .exgrid.showfull .fullt{display:none}
.exgrid.showfull .srow{grid-template-columns:52px 1fr 70px}
.lossbox label{display:inline-flex;align-items:center;gap:3px;font-size:13px} .lossbox input{width:54px;padding:4px 6px}
.stickysave{position:sticky;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 8px);background:var(--surface);padding:10px 0 4px;margin-top:14px;z-index:5}
.examform .loss{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;padding:0 0 8px 64px}
.examform .loss label{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:4px}
.examform .loss input{width:52px;padding:5px 6px;font-size:14px}
@media (max-width:520px){.examform .loss{padding-left:0}}

.terms{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.terms div{border-radius:8px;background:var(--surface2);padding:8px 4px;text-align:center;font-size:12.5px;color:var(--ink2)}
.terms div.now{background:var(--accent);color:#fff}
.terms div.past{background:var(--accent-bg);color:var(--accent)}
.terms b{display:block;font-family:var(--mono);font-size:15px}
.ms{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ms .when{width:84px;flex:none;color:var(--ink2);font-size:13px}

#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabin{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tabin button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--ink3);position:relative}
.tabin button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabin button.on{color:var(--accent)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--amber);color:#fff;border-radius:999px;font-size:10.5px;min-width:17px;height:17px;line-height:17px;padding:0 4px;font-family:var(--mono);font-style:normal}
#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw}
#toast.show{opacity:1}
svg.chart text{font-family:var(--sans);fill:var(--ink2)}
details>summary{cursor:pointer}
.methods td:first-child{white-space:nowrap;font-weight:600}
ol.guide{padding-left:20px;margin:6px 0;font-size:14px} ol.guide li{margin:4px 0}

.mic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;flex:none}
.mic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.mic.rec{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}
.withmic{display:flex;gap:8px;align-items:flex-start}.withmic > textarea,.withmic > input{flex:1}
#printbox{display:none}
@media print{
  body{background:#fff;color:#000;padding:0}
  body > *:not(#printbox){display:none !important}
  #printbox{display:block;font-family:var(--sans);font-size:12pt;line-height:1.5;color:#000}
  #printbox h1{font-family:var(--serif);font-size:20pt;margin:0 0 2pt}
  #printbox h2{font-family:var(--serif);font-size:15pt;margin:16pt 0 4pt;border-bottom:1.5pt solid #000;padding-bottom:2pt}
  #printbox h2 span{font-size:10pt;font-weight:400;color:#555;font-family:var(--sans)}
  #printbox h3{font-size:12pt;margin:10pt 0 4pt;color:#333}
  #printbox .pm,#printbox .pmeta{font-size:9.5pt;color:#555}
  #printbox .pi{break-inside:avoid;padding:6pt 0;border-bottom:.5pt dashed #999}
  #printbox .pq{font-size:12.5pt}
  #printbox .pblank{height:70pt}
  #printbox .ppic{display:block;max-width:100%;max-height:7cm;margin:4pt 0;object-fit:contain}
  #printbox .pblank.sm{height:40pt;font-size:9pt;color:#888}
  #printbox .pbreak{break-before:page}
  #printbox table.pw{width:100%;border-collapse:collapse;font-size:11.5pt}
  #printbox table.pw th,#printbox table.pw td{border:.5pt solid #999;padding:5pt 6pt;height:22pt;text-align:left}
  #printbox .pwen{font-family:Georgia,serif;font-size:13pt}
  #printbox .pp{break-inside:avoid;margin-bottom:14pt}
  #printbox .pwk{font-size:10.5pt;line-height:1.45}
  #printbox .pwk h2{font-size:13pt;margin:10pt 0 3pt}
  #printbox .pwk p{margin:3pt 0}
  #printbox .pwk table.pw td,#printbox .pwk table.pw th{height:auto;padding:3pt 5pt;font-size:10pt}
  #printbox table.pk td{text-align:center;height:auto;padding:6pt}
  #printbox table.pk b{font-size:16pt;font-family:var(--mono)}
  #printbox table.pk span{font-size:9pt;color:#555}
  #printbox ul{margin:2pt 0;padding-left:16pt} #printbox li{margin:2pt 0}
  #printbox .ppl{font-family:var(--serif);font-size:14pt;line-height:2;letter-spacing:.06em}
}

/* 一步一步填：全屏、一次只问一件事、大按钮、点完自动下一步 */
.wiz{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);z-index:60;background:var(--bg);display:flex;flex-direction:column}
.wiz-top{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;max-width:680px;margin:0 auto;width:100%}
.wiz-dots{display:flex;gap:4px;flex:1}
.wiz-dots i{flex:1;height:6px;border-radius:3px;background:var(--surface2)}
.wiz-dots i.done{background:var(--accent)} .wiz-dots i.cur{background:var(--ink)}
.wiz-x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;color:var(--ink2)}
.wiz-body{flex:1;overflow:auto;padding:8px 20px 20px;max-width:680px;margin:0 auto;width:100%;-webkit-overflow-scrolling:touch}
.wiz-subj{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink2);margin:10px 0 2px}
.wiz-subj .dot{width:12px;height:12px}
.wiz-q{font-family:var(--serif);font-size:27px;font-weight:700;margin:2px 0 18px;line-height:1.3}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.big.two{grid-template-columns:1fr 1fr}
.big button{min-height:70px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-size:21px;font-weight:600;box-shadow:var(--shadow);color:var(--ink);padding:6px}
.big button small{display:block;font-size:12.5px;font-weight:400;color:var(--ink3);margin-top:2px}
.big button.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.big button.wide{grid-column:1/-1;min-height:56px;font-size:18px}
.big button.soft{color:var(--ink2);font-weight:500}
.wiz-lab{font-weight:600;margin:18px 0 8px;font-size:15px}
.wiz-lab .faint{font-weight:400;font-size:13px}
.seg.wide{display:flex;width:100%}
.seg.wide button{flex:1;min-height:44px;font-size:14px;padding:4px}
.cnt.sm{padding:6px 12px;margin-bottom:6px}
.cnt{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.cnt .nm{flex:1;font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}
.cnt button{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface3);font-size:28px;line-height:1;color:var(--ink)}
.cnt .v{font-family:var(--mono);font-size:28px;min-width:36px;text-align:center}
.wiz-foot{display:flex;gap:10px;padding:10px 20px calc(14px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto;width:100%}
.wiz-foot .btn{flex:1;min-height:54px;font-size:17px}
.wiz-in{font-size:19px !important;padding:14px !important;border-radius:14px !important}
.wiz-sum{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.wiz-sum b{flex:none;white-space:nowrap}
.fillbtn{width:100%;min-height:56px;border-radius:var(--r);font-size:17px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px}
/* ================= 设计层 v2（2026-09-29）：参照 Apple HIG——5 级字号、去边框靠留白和轻阴影分层、分组列表+图标、大标题 =================
   只覆盖外观，不动结构；整块删掉即回到旧样式 */
:root{
  --bg:#f1f2ee; --surface:#ffffff; --surface2:#ebece7; --surface3:#f7f8f5;
  --ink:#1b1f26; --ink2:#5f6570; --ink3:#9aa0a8; --line:#e2e4de;
  --accent:#24406b; --accent-bg:#e6ecf5; --pen:#c8372d;
  --amber:#a8650f; --amber-bg:#fbefdc;
  --good:#2e7a57; --good-bg:#e2f1e8;
  --shadow:0 1px 2px rgba(30,25,15,.04),0 8px 24px rgba(30,25,15,.06);
  --mono:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111315; --surface:#1b1e22; --surface2:#262a2f; --surface3:#16191c;
  --ink:#eef0f2; --ink2:#a9b0b9; --ink3:#747b84; --line:#2c3137; --pen:#ff7b6b;
  --accent:#9dbdf0; --accent-bg:#1f2b3d; --amber:#f0b35e; --amber-bg:#3a2d18; --good:#7ccfa5; --good-bg:#18301f;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset;
}}
html,body{font-size:17px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;letter-spacing:.005em}
h2{font-family:var(--sans);font-size:28px;font-weight:700;letter-spacing:-.01em;margin:4px 0 8px}
h3{font-family:var(--sans);font-size:17px;font-weight:600;margin:0 0 8px}
.small{font-size:13px} .sub{font-size:15px}
.card{border:0;border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.tip{background:transparent;border-radius:0;font-size:15px;padding:2px 4px 12px;color:var(--ink2)}
.tip b{color:var(--ink)}
.big button{border:0;box-shadow:var(--shadow)}
.big button.on{border:0;background:var(--accent-bg);color:var(--accent);box-shadow:none}
.btn{border:0;background:var(--surface2);border-radius:14px;font-weight:500;min-height:44px;transition:transform .12s ease,opacity .12s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.sm{border-radius:12px;min-height:36px;font-size:15px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.primary{box-shadow:0 6px 16px rgba(36,64,107,.22)}
.chip{border:0;background:var(--surface2);font-weight:500}
.seg{border:0;background:var(--surface2);border-radius:12px;padding:2px}
.seg button{border:0;border-radius:10px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pill{font-weight:500;padding:3px 9px}
input[type=text],input[type=number],input[type=date],input[type=password],textarea,select{border:1px solid transparent;background:var(--surface2);border-radius:12px}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:var(--surface)}
a{color:var(--accent);text-decoration:none}
.redo .row a.small,.small a{font-weight:500;text-decoration:none}
#top{border-bottom:0}
.brand{font-family:var(--sans);font-size:17px;font-weight:700;letter-spacing:0}
#tabs{background:rgba(255,255,255,.82);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){#tabs{background:rgba(29,28,26,.82);border-top-color:rgba(255,255,255,.08)}}
.tabin button{font-size:11px;font-weight:500}
.tabin button svg{width:25px;height:25px;stroke-width:1.6}

/* 今天：大标题日期、主按钮、分组清单（图标方块 + 完成打勾动画） */
.card.hero{background:transparent;box-shadow:none;padding:4px 2px 6px}
.hero .d{font-family:var(--serif);font-size:32px;font-weight:700;letter-spacing:.01em}
.hero .w{font-size:15px}
.navbtn{border:0;background:var(--surface2);border-radius:50%;width:36px;height:36px;color:var(--ink2)}
.streak{font-weight:600;background:var(--amber-bg)}
.streak b{font-family:var(--sans)}
.fillbtn{min-height:58px;border-radius:18px;font-size:18px;letter-spacing:.01em}
.card.todo{padding:0;overflow:hidden}
.todo-r{padding:12px 16px;gap:14px;border-top:.5px solid var(--line);font-size:17px;min-height:60px;transition:background .15s}
.todo-r:active{background:var(--surface2)}
.todo-r .t{font-weight:600}
.todo-r .s{font-size:15px}
.todo-r .chev{font-size:22px;color:var(--ink3);opacity:.7}
.todo-r .ck{width:36px;height:36px;border-radius:10px;border:0;position:relative;background:var(--surface2);font-size:17px}
.todo-r .ck::after{content:'';position:absolute;inset:7px;-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat;background:var(--icc,var(--ink2))}
.todo-r.done .ck{background:transparent !important;color:transparent;font-size:0}
.todo-r.done .ck::before{content:'';position:absolute;inset:2px;-webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'><path d='M3.5 13.2c2 1.2 3.9 3 5.4 5.6C11.6 12.6 15.8 7.6 21 3.8'/></svg>") center/contain no-repeat;mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'><path d='M3.5 13.2c2 1.2 3.9 3 5.4 5.6C11.6 12.6 15.8 7.6 21 3.8'/></svg>") center/contain no-repeat;background:var(--pen)}
.todo-r.done.fresh .ck::before{animation:pen .5s cubic-bezier(.4,.1,.3,1) both}
@keyframes pen{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.todo-r.done .ck::after{display:none}
.todo-r.done .t{color:var(--ink3);font-weight:500}
.todo-r.next{background:linear-gradient(90deg,var(--accent-bg),transparent 70%)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.tools .btn{background:var(--surface);box-shadow:var(--shadow);border:0;color:var(--ink);font-weight:500}
/* 学习方块：左上角图标 */
.tile{border:0;border-radius:20px;padding:16px;min-height:124px;gap:3px}
.tile::before{content:'';width:40px;height:40px;border-radius:12px;background:var(--ict,var(--surface2));margin-bottom:8px;flex:none}
.tile::after{content:'';position:absolute;top:24px;left:24px;width:24px;height:24px;-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat;background:var(--icc,var(--ink2))}
.tile{position:relative}
.tile .tn{font-size:17px}
.tile.due{box-shadow:0 0 0 2px var(--accent) inset,var(--shadow);border:0}

.todo-r[data-v=card] .ck{--ic:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'><path d='M3 18l4.5-12L12 18M4.7 14h5.6'/><circle cx='17' cy='15' r='3'/><path d='M20 12v6'/></svg>");background:#efe9f7;--icc:#6a4c9c}
.todo-r[data-v=recite] .ck{--ic:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'><path d='M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z'/><path d='M5 17a3 3 0 0 1 3-3h11'/></svg>");background:#e2f1e8;--icc:#2e7a57}
.todo-r[data-v=read] .ck{--ic:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'><path d='M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z'/><path d='M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z'/></svg>");background:#e1f0ef;--icc:#2a7270}
.todo-r[data-act=holgo] .ck{--ic:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='4'/><path d='M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4'/></svg>");background:#fdeee3;--icc:#b5582a}
.todo-r[data-v=speak] .ck{--ic:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'><rect x='9' y='3' width='6' height='11' rx='3'/><path d='M5 11a7 7 0 0 0 14 0M12 18v3'/></svg>");background:#f8e8ee;--icc:#a1476a}
.todo-r[data-v=pe] .ck{--ic:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'><path d='M3 12h4l3-8 4 16 3-8h4'/></svg>");background:#fbe9e7;--icc:#a4443a}
.tile[data-v=card]{--ic:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'><path d='M3 18l4.5-12L12 18M4.7 14h5.6'/><circle cx='17' cy='15' r='3'/><path d='M20 12v6'/></svg>");--ict:#efe9f7;--icc:#6a4c9c}
.tile[data-v=recite]{--ic:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'><path d='M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z'/><path d='M5 17a3 3 0 0 1 3-3h11'/></svg>");--ict:#e2f1e8;--icc:#2e7a57}
.tile[data-v=read]{--ic:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'><path d='M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z'/><path d='M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z'/></svg>");--ict:#e1f0ef;--icc:#2a7270}
.tile[data-v=speak]{--ic:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'><rect x='9' y='3' width='6' height='11' rx='3'/><path d='M5 11a7 7 0 0 0 14 0M12 18v3'/></svg>");--ict:#f8e8ee;--icc:#a1476a}
.tile[data-v=pe]{--ic:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'><path d='M3 12h4l3-8 4 16 3-8h4'/></svg>");--ict:#fbe9e7;--icc:#a4443a}
.tile[href="../math/"]{--ic:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'><path d='M5 8h6M8 5v6M13 16h6M5 16l5 5M10 16l-5 5M14 7h5'/></svg>");--ict:#e8eef7;--icc:#2b4c7e}
.tile[data-v=books]{--ic:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'><path d='M4 5h5v14H4zM10 5h5v14h-5z'/><path d='M16 6l4 1-3 13-4-1'/></svg>");--ict:#eeece6;--icc:#67625a}
@media (prefers-color-scheme:dark){
.todo-r[data-act=wizstart]:not(.done) .ck,.todo-r[data-act=slopen]:not(.done) .ck{background:#1f2b3d;--icc:#9dbdf0}

  const d = P(s), y = d.getFullYear(), m = d.getMonth()+1, G = ['七','八','九'];
  let g, t;
  if (m >= 9) { g = y - startYear; t = '上'; } else if (m <= 1) { g = y-1-startYear; t = '上'; }

function holLeftList(h){ return h.tasks.map(t => ({t, left: t.n - holDone(t, () => true)})).filter(o => o.left > 0); }

function dayHasData(d){
  if (itemsOn(d).length) return true;
  const dd = DB.days[d]; if (!dd) return false;
  if (dd.mood || dd.answer || dd.note) return true;
  return Object.values(dd.subj||{}).some(r => r.none || r.min>0 || r.stuck || (r.intr && r.intr!=='none'));
}
function autoAnchors(mon){
  const out = {};
  for (const s of DB.settings.subjects) {
    const xs = [];
    for (const d of range(addD(mon, -14), addD(mon, -1))) { const r = DB.days[d] && DB.days[d].subj[s.id]; if (r && !r.none && r.min > 0) xs.push(r.min); }
    if (xs.length >= 4) { xs.sort((a,b) => a-b); out[s.id] = Math.max(10, Math.round(xs[Math.floor(xs.length/2)] / 5) * 5); }
  }
  return out;
}
/* 锚点：默认按孩子前两周实际用时自动定（数据驱动，家长不用猜）；家长在周复盘里改过的科目以家长为准 */
function anchorsFor(mon){
  const ks = Object.keys(DB.weeks).filter(k => k < mon && DB.weeks[k].next).sort();
  const k = ks.pop();
  return Object.assign({}, DB.settings.anchors, autoAnchors(mon), k ? DB.weeks[k].next : {});
}
function delRec(kind, id){ DB[kind] = DB[kind].filter(x => x.id !== id); DB.del[id] = now(); }

/* 记录节奏：指数平滑（半衰期 7 天），断一两天不会清零——借鉴 Loop Habit Tracker 的习惯强度 */
function rhythm(){
  const ds = Object.keys(DB.days).concat(Object.keys(IDX)).sort(); if (!ds.length) return null;
  const first = ds[0], t = today(); if (dayDiff(first, t) < 2) return null;
  const a = 1 - Math.pow(0.5, 1/7); let s = 0;
  for (const d of range(first, t)) s = s*(1-a) + a*(dayHasData(d) ? 1 : 0);
  return Math.round(s*100);
}

/* ================= 统计 ================= */
function stats(from, to){
  const S = {}; const days = range(from, to);
  let recDays = 0; const mood = {tired:[], ok:[], good:[]}; const errByDay = {};
  const tagsByType = {calc:{}, concept:{}, read:{}}; const conf = {sure:0, unsure:0, no:0, none:0};
  const dayMin = [];
  for (const s of DB.settings.subjects) S[s.id] = {min:0, days:0, intrN:0, intr:{early:0,mid:0,late:0}, errs:{calc:0,concept:0,read:0}, tags:{}, stuck:[], byDay:{}, errDay:{}, recOn:0};
  for (const d of days) {
    if (!dayHasData(d)) continue;
    recDays++;
    const dd = DB.days[d] || {subj:{}};
    let tot = 0;
    for (const sid in dd.subj) {
      const r = dd.subj[sid]; const x = S[sid]; if (!x) continue;
      x.byDay[d] = r;
      if (r.none) continue;
      x.recOn++;
      if (r.min > 0) { x.min += r.min; x.days++; tot += r.min; }
      if (r.intr && r.intr !== 'none') { x.intrN++; x.intr[r.intr]++; }
      if (r.stuck) x.stuck.push({d, sid, text:r.stuck});
    }
    if (tot) dayMin.push(tot);
    let e = 0;
    for (const it of itemsOn(d)) {
      const x = S[it.sid]; if (!x) continue;
      x.errs[it.type]++; e++; x.errDay[d] = (x.errDay[d]||0) + 1;
      conf[it.conf || 'none']++;
      for (const tg of splitTags(it.tag)) { x.tags[tg] = (x.tags[tg]||0) + 1; const key = tg+'｜'+subjById(it.sid).name; tagsByType[it.type][key] = (tagsByType[it.type][key]||0) + 1; }
    }
    errByDay[d] = e;
    if (dd.mood) mood[dd.mood].push(d);
  }
  const errs = {calc:0,concept:0,read:0};
  for (const sid in S) for (const t of ET) errs[t.k] += S[sid].errs[t.k];
  let redoN = 0, redoOk = 0;
  for (const it of allItems()) for (const h of (it.hist||[])) if (h.d >= from && h.d <= to) { redoN++; if (h.ok) redoOk++; }
  return {S, days, recDays, mood, errByDay, errs, errN: sum(Object.values(errs)), tagsByType, conf, from, to, dayMin, redoN, redoOk};
}

/* 观察发现：只描述模式不下判决；基准是孩子自己的锚点和上一周期 */
function findings(st, prev, anchors, nDays, monthly){
  const out = [];
  if (st.recDays === 0) return [{k:'info', t:'这段时间还没有记录。'}];
  if (st.recDays < Math.ceil(nDays * 4/7)) out.push({k:'info', t:`只记了 ${st.recDays} 天，下面的发现样本少，先当线索看，别当结论。`});
  for (const s of subjects(st.to)) {
    const x = st.S[s.id]; if (!x) continue;
    const a = anchors ? (anchors[s.id]||0) : 0;
    const avg = x.days ? x.min / x.days : 0;
    const intrRate = x.recOn ? x.intrN / x.recOn : 0;
    const eN = sum(Object.values(x.errs));
    const nm = `<b>${esc(s.name)}</b>`;
    if (a && x.days >= 3 && avg < a*0.7) {
      if (intrRate >= 0.4) {
        let t = `${nm} 平均每天 ${Math.round(avg)} 分钟，锚点 ${a} 分钟，少了 ${pct(a-avg,a)}%；${x.recOn} 天里 ${x.intrN} 天中途中断。用时短可能是卡住就换科，不一定是做得快。`;
        if (x.errs.concept >= Math.max(2, eN*0.4)) t += ` 这科错题又以<b>概念混淆</b>为主（${x.errs.concept}/${eN}），两个信号指向同一处：概念没弄懂时就停下了。`;
        out.push({k:'signal', t: t + ' 可以问：「做到哪一步开始想换别的？」', p:3, act:`${s.name}卡住时先把题圈出来，接着往下做，不换科`, m:{kind:'intr', sid:s.id}});
      } else if (eN <= 1) out.push({k:'good', t:`${nm} 平均 ${Math.round(avg)} 分钟，比锚点 ${a} 分钟少，没中断、错题也少，可能确实做得快。锚点先不动。`});
      else out.push({k:'info', t:`${nm} 平均 ${Math.round(avg)} 分钟，比锚点 ${a} 分钟少 ${pct(a-avg,a)}%，但很少中断。可能锚点定高了，也可能作业量少。`});
    } else if (x.days >= 3 && /数学/.test(s.name) && avg > 60) {
      out.push({k:'signal', t:`${nm} 平均每天 ${Math.round(avg)} 分钟。中国八年级的追踪研究里，数学作业时长和成绩是倒 U 形，最优约 45 分钟；超过 60 分钟更可能是卡住了，不是更努力。看看卡点记录。`, p:2, act:`${s.name}做到 60 分钟就停，卡住的题圈出来第二天问老师`, m:{kind:'avg', sid:s.id}});
    } else if (a && x.days >= 3 && avg > a*1.4) {
      out.push({k:'info', t:`${nm} 平均 ${Math.round(avg)} 分钟，超出锚点 ${a} 分钟 ${pct(avg-a,a)}%。是作业量大，还是卡住了？`});
    }
    if (x.intrN >= 2 && x.intr.early / x.intrN >= 0.6)
      out.push({k:'signal', t:`${nm} 的中断有 ${x.intr.early}/${x.intrN} 次在<b>前 15 分钟</b>。可能是启动困难：开头先放一道肯定能做对的小题，拿到一次小成功再往下。`, p:4, act:`${s.name}开头先做一道肯定会的小题，再往下做`, m:{kind:'early', sid:s.id}});
  }
  if (st.dayMin.length >= 3) {
    const avgTot = sum(st.dayMin)/st.dayMin.length;
    if (avgTot > 90) out.push({k:'signal', t:`有记录的日子平均每天作业 ${Math.round(avgTot)} 分钟，超过教育部规定的初中书面作业 90 分钟上限。持续这样，建议和老师沟通作业量，不要先当成拖拉。`, p:1, act:'家长和老师沟通一次作业量', m:{kind:'total'}});
  }
  if (st.conf.sure >= 2) out.push({k:'info', t:`有 <b>${st.conf.sure} 道</b>是「做的时候有把握」却错了。研究发现这类错误改正后最不容易再犯，已排在重做队列最前面。`});
  if (st.errN >= 4) {
    const top = ET.map(t=>[t, st.errs[t.k]]).sort((a,b)=>b[1]-a[1])[0];
    if (top[1] / st.errN >= 0.5) {
      const tg = topEntries(st.tagsByType[top[0].k], 2).filter(e=>e[1]>=2);
      let t = `错题 ${st.errN} 道，其中<b>${top[0].n}</b> ${top[1]} 道（${pct(top[1],st.errN)}%）`;
      if (tg.length) t += `，集中在 ` + tg.map(e=>{ const p=e[0].split('｜'); return `${esc(p[1])}「${esc(p[0])}」${e[1]} 道`; }).join('、');
      if (top[0].k === 'concept') t += '。概念混淆光刷题没用，要回到课本例题把那个概念讲一遍。';
      else if (top[0].k === 'read') t += '。审题失误可以试试「圈条件」：做题前先把已知条件圈出来。';
      else t += monthly ? '。这三类分法没有经过研究验证，计算错误占大头时，抽两道和孩子确认：是真的算错，还是其实概念没懂。' : '。计算错误多，通常靠固定格式的小练习解决，不用加量。';
      const acts = {concept:'没做对的题回课本找对应的例题，自己讲一遍', read:'做题前先把已知条件圈出来', calc:'每天做 5 道同类的计算小题，固定格式'};
      out.push({k:'signal', t, p:2, act: acts[top[0].k], m:{kind:'type', t:top[0].k}});
    }
  }
  { const cnt = {}; for (const it of allItems()) if (it.d >= st.from && it.d <= st.to && it.sub) { const k = it.sid + '|' + it.type + '|' + it.sub; cnt[k] = (cnt[k]||0) + 1; }
    for (const [k, n] of topEntries(cnt, 3)) { if (n < 3) continue; const [sid, type] = k.split('|'); const it = {sid, type, sub:k.split('|')[2]}; const tx = taxOf(sid);
      out.push({k:'signal', t:`<b>${esc(subjById(sid).name)}「${esc(subName(it))}」</b>出现 ${n} 次（${typeNameS(sid, type)}）。同一个具体问题反复出现，说明是知识漏洞而不是状态问题${tx && tx.next[type] ? '。下一步：' + esc(tx.next[type]) : ''}。`, p:5, act:`${subjById(sid).name}「${subName(it)}」：${tx && tx.next[type] ? tx.next[type] : '回课本找对应例题讲一遍'}`, m:{kind:'sub', sid, type, sub:k.split('|')[2]}}); } }
  if (prev && prev.recDays >= 3 && st.recDays >= 5) {
    for (const t of ET) {
      const a = st.errs[t.k] / st.recDays * 7, b = prev.errs[t.k] / prev.recDays * 7;
      if (b >= 2 && a <= b * 0.5) out.push({k:'good', t:`<b>${t.n}</b>比上一段少了（按 7 天折算 ${b.toFixed(1)} → ${a.toFixed(1)} 道）。`});
      else if (a >= 3 && a >= b * 1.8 && a - b >= 2) out.push({k:'signal', t:`<b>${t.n}</b>比上一段多了（按 7 天折算 ${b.toFixed(1)} → ${a.toFixed(1)} 道）。先问是哪几道、卡在哪一步。`, p:1, act:`每晚问一句：今天${t.n}的那道卡在哪一步`, m:{kind:'type', t:t.k}});
    }
  }
  if (st.redoN >= 3) out.push({k: st.redoOk/st.redoN >= 0.6 ? 'good' : 'info', t:`重做了 ${st.redoN} 次，做对 ${st.redoOk} 次（${pct(st.redoOk, st.redoN)}%）。` + (st.redoOk/st.redoN < 0.5 ? ' 重做正确率偏低，说明这些题的概念还没补上，先回课本，别急着再做。' : '')});
  { const rw = readWeek(st.from, st.to); if (rw.pages || rw.sums) out.push({k: 'info', t: `名著阅读：读了 ${rw.pages} 页${rw.sums ? `，读完说了 ${rw.sums} 次` : ''}`}); }
  { const hs = hintStats(st.from, st.to); if (hs.n >= 2) out.push({k: hs.ok / hs.n >= 0.6 ? 'good' : 'info', t: `AI 提示之后自己再做：${hs.n} 次里做对 ${hs.ok} 次（${pct(hs.ok, hs.n)}%）。看的是提示有没有帮他自己做出来，不是用了多久`}); }
  const tired = st.mood.tired, others = st.days.filter(d => d in st.errByDay && !tired.includes(d));
  if (tired.length >= 2 && others.length >= 2) {
    const a = sum(tired.map(d=>st.errByDay[d]||0))/tired.length, b = sum(others.map(d=>st.errByDay[d]||0))/others.length;
    if (a >= 2 && a >= b * 1.5) out.push({k:'signal', t:`精神「困」的 ${tired.length} 天，平均每天错 ${a.toFixed(1)} 道，其他天 ${b.toFixed(1)} 道。先看睡眠，再看知识点。`, p:2, act:'这周 22 点前睡', m:{kind:'tired'}});
  }
  const stuckN = sum(Object.values(st.S).map(x=>x.stuck.length));
  if (stuckN === 0 && st.recDays >= 3) out.push({k:'info', t:'卡点一条也没记。明晚试试只问一句：「哪一步最不确定？」孩子的回答本身就是诊断。'});
  if (!out.some(o=>o.k!=='info')) out.push({k:'good', t:'没有明显的异常信号。节奏稳住就是进展。'});

/* ================= 自动复盘：每周自动挑一件调整 → 下周自动检验效果；每月自动定一个可量化目标 =================

function metricValue(m, from, to){
  if (!m || from > to) return null;
  const st = stats(from, to); if (st.recDays < 5) return null;
  const k7 = 7 / st.recDays, x = m.sid ? st.S[m.sid] : null;
  switch (m.kind) {
    case 'intr': return x ? x.intrN * k7 : null;

    case 'avg': return x && x.days ? x.min / x.days : null;
    case 'total': return st.dayMin.length ? sum(st.dayMin) / st.dayMin.length : null;
    case 'type': return st.errs[m.t] * k7;
    case 'sub': return allItems().filter(it => it.d >= from && it.d <= to && it.sid === m.sid && it.sub === m.sub).length * k7;

}

}

  if (imp >= 0.3) return {k:'good', t:'有效'};

  // 期末前 3 周：每天从已掌握的题里抽 1 道回检（隔得最久的先来）
  if (examSeason(t)) { const done = allItems().filter(it => it.done && !it.skipped && queued(it)), last = it => ((it.hist || []).slice(-1)[0] || {}).d || it.d;

/* ================= 同步：WebCrypto 加密 → GitHub 私有仓库 ================= */

/* ================= 考试 ================= */
const hasScore = x => x && x.s !== '' && x.s != null;
function examTotal(e){ let s=0, f=0; for (const k in e.scores) { const x = e.scores[k]; if (hasScore(x)) { s += +x.s; f += +(x.full||100); } } return {s, f}; }
/* 中考口径：各科得分率 × 深圳中考满分（只算本次考了的、计入总分的科目） */
function zkRate(e){
  let got = 0, full = 0;
  for (const s of DB.settings.subjects) { const x = e.scores[s.id]; if (!s.inTotal || !hasScore(x)) continue; got += x.s/(x.full||100)*s.zk; full += s.zk; }
  return full ? {got:Math.round(got), full, rate:Math.round(got/full*100)} : null;
}
function prevScore(e, sid){
  const list = DB.exams.filter(x => x.id !== e.id && x.date < e.date && hasScore(x.scores[sid])).sort((a,b)=>a.date<b.date?1:-1);
  return list[0] ? list[0].scores[sid] : null;
}

}

  else if (k === 'anchor') { const w = DB.weeks[state.week] = DB.weeks[state.week] || {}; w.next = Object.assign({}, anchorsFor(state.week), w.next||{}); w.next[el.dataset.s] = Math.max(0, +v||0); w.u = now(); (w.fu = w.fu || {}).next = w.u; }
  else if (k === 'month') { const m = DB.months[state.month] = DB.months[state.month] || {}; m[f] = v; m.u = now(); (m.fu = m.fu || {})[f] = m.u; }
  else if (k === 'set') { setSetting(f, f === 'startYear' ? (+v || 2026) : v); }
  else if (k === 'sname') { const x = DB.settings.subjects.find(s => s.id === el.dataset.s); if (x && v.trim()) { x.name = v.trim(); x.u = now(); DB.settings.u = now(); } }
  save();
}

/* iPad 键盘弹出时，全屏弹窗缩到键盘上方：Safari 不会因为键盘改变固定定位元素的高度，底部的输入框和按钮会被盖住 */
(function(){ const vv = window.visualViewport; if (!vv) return; const root = document.documentElement;
  const fit = () => { const kb = window.innerHeight - vv.height > 80;   // 高度差明显才当作键盘弹出
    if (kb) { root.style.setProperty('--vvh', vv.height + 'px'); root.style.setProperty('--vvt', vv.offsetTop + 'px'); } else { root.style.removeProperty('--vvh'); root.style.removeProperty('--vvt'); }
    if (kb) { const a = document.activeElement; if (a && a.closest && a.closest('.wiz') && a.scrollIntoView) setTimeout(() => a.scrollIntoView({block: 'nearest'}), 30); } };
  vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); })();
let lastToday = today();
/* 跨过零点：切回前台、每分钟、点「今天」时都检查；正在记作业/记问题等弹窗里时先不切，免得记到一半落到新的一天 */
function checkDay(){ const t = today(); if (t === lastToday) return false;
  if (state.wiz || state.mix || state.qp || state.tutor || state.rcheck || state.variant || state.precog || state.photo || state.voice || isTyping()) return false;
  if (state.date === lastToday) state.date = t; if (state.week === monOf(lastToday)) state.week = monOf(t); if (state.month === mKey(lastToday)) state.month = mKey(t);
  lastToday = t; render(); return true; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkDay(); });
setInterval(checkDay, 60000);

    const wk = Math.floor(dayDiff(start, d) / 7);
    for (const sid of act) {
      if (['df','ls','dl','sw'].includes(sid) && rnd() < 0.5) { dd.subj[sid] = {none:true, min:0, intr:'none'}; continue; }
      const base = DB.settings.anchors[sid];
      let min = Math.round((base * (0.8 + rnd()*0.5))/5)*5, intr = 'none', stuck = '';
      const add = (type, tag, conf) => { const it = {id:uid('i'), d, sid, type, conf, tag, box:0, due:addD(d, BOXES[0]), hist:[], done:false, u:1};
        if (it.due < t && rnd() < 0.7) { const ok = rnd() < 0.65; it.hist.push({d:it.due, ok}); if (ok) { it.box = 1; it.due = addD(it.due, BOXES[1]); if (it.due < t && rnd() < 0.7) { it.hist.push({d:it.due, ok:true}); it.box = 2; it.due = addD(it.due, BOXES[2]); } } else it.due = addD(it.due, 1); }
        DB.items.push(it); };
      if (sid === 'sx') {
        const improving = wk >= 4;
        if (rnd() < (improving ? 0.25 : 0.6)) { intr = rnd() < 0.75 ? 'early' : 'mid'; min = Math.round(base*(0.45+rnd()*0.2)/5)*5; }
        if (rnd() < (improving ? 0.3 : 0.7)) add('concept', pick(['去括号','有理数混合运算','一元一次方程移项']), pick(['sure','unsure','no','no']));
        if (rnd() < 0.5) add('calc', pick(['有理数混合运算','负数乘方']), pick(['sure','unsure']));
        if (rnd() < 0.4) stuck = pick(['去括号的时候后面的项要不要变号','负数乘方那一步','移项不知道要不要变号','行程题不知道用相遇还是追及']);
      } else if (sid === 'yy') {
        if (rnd() < 0.4) add('read', pick(['完形填空','阅读理解']), pick(['sure','unsure']));
        if (rnd() < 0.3) add('concept', pick(['一般现在时三单','be动词']), 'unsure');
        if (rnd() < 0.2) stuck = '第 5 空在 which 和 that 之间犹豫';
      } else if (sid === 'yw') {
        if (rnd() < 0.35) add('read', pick(['阅读理解','古诗默写']), pick(['unsure','sure']));
        if (rnd() < 0.2) stuck = '说明方法那道题看不出是举例子还是列数字';
      } else if (rnd() < 0.15) add('concept', '', 'no');
      dd.subj[sid] = {min, intr, stuck};
    }
    if (rnd() < 0.3) dd.answer = pick(['数学第三题第二步','英语作文开头不会写','今天都还行','去括号那里']);
  }
  const m0 = monOf(start);
  DB.weeks[addD(m0,7)] = {found:'数学中断都在前15分钟，错题以概念混淆为主，卡在去括号', adjust:'数学开头先做 2 道会做的去括号小题', next:{sx:40}, u:1};
  DB.weeks[addD(m0,21)] = {found:'数学中断从 4 次降到 2 次', adjust:'锚点不动，继续观察', next:{sx:40}, u:1};
  DB.exams = [
    {id:'e1', date:addD(start,5), name:'开学摸底', type:'单元测验', scores:{yw:{s:88,full:120},sx:{s:52,full:100,loss:{calc:12,concept:26,read:10}},yy:{s:81,full:100}}, u:1},
    {id:'e2', date:addD(start,24), name:'第一单元测验', type:'单元测验', scores:{yw:{s:92,full:120},sx:{s:58,full:100,loss:{calc:10,concept:20,read:12}},yy:{s:84,full:100}}, u:1},
    {id:'e3', date:addD(start,40), name:'第一次月考', type:'月考', scores:{yw:{s:95,full:120},sx:{s:66,full:100,loss:{calc:10,concept:14,read:10}},yy:{s:83,full:100},df:{s:41,full:50},ls:{s:52,full:70}}, rankClass:'28', prep:['重做了错题','看了课本例题'], oneThing:'数学先做计算题，做完回头检查一遍符号', u:1},
