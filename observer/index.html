<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="每日观察">
<meta name="theme-color" content="#f5f1e8">
<title>每日观察</title>
<style>
/* ============================================================
   依据：《陪考手记》第 12 章「跨科通用的工具」
   四件工具 = 错题按类型索引 / 观察式时间记录 / 复盘对话 / 家长情绪标记
   视觉：观察笔记本。纸色底 + 墨色字，不用红色表示「错」——
   错题是诊断线索，不是审判证据（琥珀色 = 值得看一眼的信号）。
   ============================================================ */
:root{
  --bg:#f5f1e8; --surface:#fffdf8; --surface2:#efe9dc;
  --ink:#2b2621; --ink2:#6e665c; --ink3:#a0978a; --line:#e2dacb;
  --accent:#2f5d8a; --accent-bg:#e4ecf4;
  --amber:#a8681a; --amber-bg:#f7ead5;
  --good:#3d7a5c; --good-bg:#e1efe6;
  --danger:#a8423a;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px; --tabh:62px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#171614; --surface:#211f1c; --surface2:#2b2825;
  --ink:#ece6db; --ink2:#b1a898; --ink3:#7d7568; --line:#3a3631;
  --accent:#8cb4dc; --accent-bg:#233142;
  --amber:#e0a656; --amber-bg:#3a2e1d;
  --good:#7fc39f; --good-bg:#1f3328;
  --danger:#e08078;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
body{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 顶栏 */
#top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:860px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:baseline;gap:10px}
.brand{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:.02em}
.term{font-size:13px;color:var(--ink2)}
.saved{margin-left:auto;font-size:12px;color:var(--ink3);white-space:nowrap}
.demo-banner{background:var(--amber-bg);color:var(--amber);font-size:13px;text-align:center;padding:6px 16px}

main{max-width:860px;margin:0 auto;padding:16px}
h2{font-family:var(--serif);font-size:22px;margin:4px 0 4px}
h3{font-family:var(--serif);font-size:17px;margin:0 0 8px}
.sub{color:var(--ink2);font-size:14px;margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}

/* 通用控件 */
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;line-height:1.2;min-height:34px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.soft.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:14px;min-height:36px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-size:15px;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#10161d}}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.sm{padding:5px 10px;min-height:34px;font-size:14px}
input[type=text],input[type=number],input[type=date],input[type=password],textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:16px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:64px;resize:vertical;line-height:1.5}
label.f{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.stepper button{border:0;background:transparent;width:38px;height:38px;font-size:20px;line-height:1;color:var(--ink2)}
.stepper .v{min-width:30px;text-align:center;font-family:var(--mono);font-size:16px}
.tip{background:var(--accent-bg);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:14px;margin-bottom:12px}
.tip b{color:var(--accent)}
.signal{background:var(--amber-bg);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14.5px}
.signal.good{background:var(--good-bg)}
.signal.info{background:var(--surface2)}
.signal .k{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--amber);display:block;margin-bottom:2px}
.signal.good .k{color:var(--good)} .signal.info .k{color:var(--ink2)}
.empty{color:var(--ink3);font-size:14px;padding:18px 4px;text-align:center}

/* 今天：日期条 */
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.datebar .d{font-family:var(--serif);font-size:22px;font-weight:700}
.datebar .w{color:var(--ink2);font-size:14px}
.navbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.navbtn:disabled{opacity:.3}

/* 科目卡 */
.subj{padding:12px 14px}
.subj-h{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.subj-name{font-weight:600;font-size:17px}
.subj-sum{margin-left:auto;font-size:13px;color:var(--ink2)}
.subj.none{opacity:.55}
.subj .line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.subj .lab{font-size:13px;color:var(--ink2);width:64px;flex:none}
@media (max-width:520px){.subj .lab{width:100%}}
.mins{font-family:var(--mono);font-size:17px;min-width:56px;text-align:center}
.more{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.more summary{font-size:14px;color:var(--ink2);cursor:pointer;list-style:none;padding:4px 0}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"▸ ";color:var(--ink3)}
.more[open] summary::before{content:"▾ "}
.errs{display:flex;gap:14px;flex-wrap:wrap}
.errs .e{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--ink2)}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink2);font-size:12.5px;white-space:nowrap}
td:first-child{white-space:nowrap}
td.wrap{min-width:140px}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* 周网格 */
.wk{display:grid;grid-template-columns:52px repeat(7,1fr) 62px;gap:3px;font-size:12.5px}
.wk .hd{color:var(--ink3);text-align:center;padding:2px 0}
.wk .sn{display:flex;align-items:center;gap:5px;font-weight:600;font-size:13px;overflow:hidden;white-space:nowrap}
.wk .c{position:relative;height:34px;border-radius:6px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);color:var(--ink)}
.wk .c.blank{background:transparent;color:var(--ink3)}
.wk .c .intr{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.wk .c .intr.early{box-shadow:0 0 0 2px var(--amber-bg)}
.wk .tot{text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink2);display:flex;flex-direction:column;justify-content:center;line-height:1.25}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}

/* 考试 */
.exam-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.exam-name{font-weight:700;font-size:16px}
.tag{font-size:12px;border-radius:6px;padding:1px 7px;background:var(--surface2);color:var(--ink2)}
.tag.big{background:var(--accent-bg);color:var(--accent)}
.scores{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sc{border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:13.5px;display:flex;align-items:baseline;gap:5px}
.sc .v{font-family:var(--mono);font-size:15px;font-weight:600}
.up{color:var(--good)} .down{color:var(--amber)}
.examform .srow{display:grid;grid-template-columns:64px 1fr 1fr;gap:8px;align-items:center;margin-bottom:6px}
.examform .loss{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;padding:0 0 8px 64px}
.examform .loss label{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:4px}
.examform .loss input{width:52px;padding:5px 6px;font-size:14px}

/* 时间轴 */
.terms{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.terms div{border-radius:8px;background:var(--surface2);padding:8px 4px;text-align:center;font-size:12.5px;color:var(--ink2)}
.terms div.now{background:var(--accent);color:#fff}
.terms div.past{background:var(--accent-bg);color:var(--accent)}
.terms b{display:block;font-family:var(--mono);font-size:15px}

/* 底部 tab */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabin{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);height:var(--tabh)}
.tabin button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--ink3)}
.tabin button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabin button.on{color:var(--accent)}

#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw}
#toast.show{opacity:1}
svg.chart text{font-family:var(--sans);fill:var(--ink2)}
.methods td:first-child{white-space:nowrap;font-weight:600}
</style>
</head>
<body>
<header id="top"></header>
<main id="main"></main>
<nav id="tabs"></nav>
<div id="toast"></div>
<script>
'use strict';
/* ---------------- 常量 ---------------- */
const ET = [{k:'calc',n:'计算错误',s:'计算'},{k:'concept',n:'概念混淆',s:'概念'},{k:'read',n:'审题失误',s:'审题'}];
const ET_COLOR = {calc:'#c0822a',concept:'#8a5a9e',read:'#2f8a8a'};
const LOSS = ET.concat([{k:'time',n:'时间不够',s:'时间'},{k:'gap',n:'没复习到',s:'没复习'}]);
const INTR = [{k:'none',n:'没中断'},{k:'early',n:'前15分钟'},{k:'mid',n:'中间'},{k:'late',n:'快结束'}];
const MOOD = [{k:'tired',n:'困'},{k:'ok',n:'一般'},{k:'good',n:'精神好'}];
const EXAM_T = ['单元测验','周测','月考','期中','期末','区质检','模拟考','其他'];
const BIG = ['期中','期末','区质检','模拟考'];
const DEF_SUBJ = [['yw','语文','#b5523b',30],['sx','数学','#2f5d8a',40],['yy','英语','#3d7a5c',30],['df','道法','#8a5a9e',10],['ls','历史','#9c7a2b',10],['dl','地理','#2f8a8a',10],['sw','生物','#6b8a2f',10]];
const EXTRA_COLORS = ['#a0527a','#5a6fa0','#7a6b5a','#a06b3a','#4f8a6b'];
const QUESTIONS = [
  '今天做的题里，哪一步你最不确定？',
  '这道题卡在哪一步？（不问「为什么又错」）',
  '今天哪一科做得最顺？顺在哪？',
  '读的时候，哪一句最费劲？',
  '选的时候，哪个空最犹豫？',
  '做到哪一步开始想换别的科目？',
  '最近做数学题，是不是觉得特别累？',
  '今天有没有一道题，是一开始不会、后来弄明白的？',
  '如果明天再做一遍，你会先改哪一步？',
];
const TRIGGERS = ['看到走神','同一题型重复犯错','说「我知道了」但在敷衍','想到别人家孩子','成绩或排名出来','老师在群里点名','拖到很晚还没写完','顶嘴或不耐烦'];
const MINS = [10,20,30,45,60,90];

/* ---------------- 工具 ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const P = s => { const a = s.split('-').map(Number); return new Date(a[0], a[1]-1, a[2]||1); };
const addD = (s,n) => { const d = P(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const monOf = s => { const d = P(s); d.setDate(d.getDate() - (d.getDay()+6)%7); return ymd(d); };
const mKey = s => s.slice(0,7);
const addM = (m,n) => { const d = P(m+'-01'); d.setMonth(d.getMonth()+n); return ymd(d).slice(0,7); };
const WD = '日一二三四五六';
const md = s => { const d = P(s); return (d.getMonth()+1)+'月'+d.getDate()+'日'; };
const mdShort = s => { const d = P(s); return (d.getMonth()+1)+'/'+d.getDate(); };
const wd = s => '周'+WD[P(s).getDay()];
const sum = a => a.reduce((x,y)=>x+y,0);
const pct = (a,b) => b ? Math.round(a*100/b) : 0;
const range = (from,to) => { const r=[]; for(let d=from; d<=to; d=addD(d,1)) r.push(d); return r; };
const splitTags = s => String(s||'').split(/[,，、;；\s]+/).map(x=>x.trim()).filter(Boolean);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800); }

/* 学段：9月–1月=上学期，2月–6月=下学期，7–8月=暑假 */
function termOf(s, startYear){
  const d = P(s), y = d.getFullYear(), m = d.getMonth()+1;
  const G = ['七','八','九'];
  let g, t;
  if (m >= 9) { g = y - startYear; t = '上'; }
  else if (m <= 1) { g = y - 1 - startYear; t = '上'; }
  else if (m <= 6) { g = y - 1 - startYear; t = '下'; }
  else { g = y - 1 - startYear; t = '暑'; }
  if (g < 0) return {idx:-1, label:'入学前'};
  if (g > 2) return {idx:6, label:'初中毕业后'};
  const idx = g*2 + (t === '上' ? 0 : 1);
  return {idx, label: t === '暑' ? G[g]+'年级暑假' : G[g]+'年级'+t+'学期', short: G[g]+t, summer: t==='暑'};
}

/* ---------------- 存储 ---------------- */
const QS = new URLSearchParams(location.search);
const DEMO = QS.has('demo');
const KEY = DEMO ? 'observer-demo-v1' : 'observer-v1';
let DB;
function fresh(){
  return {v:1,
    settings:{child:'儿子', startYear:2026, pin:'', lastBackup:null,
      subjects: DEF_SUBJ.map(a=>({id:a[0],name:a[1],color:a[2],hidden:false})),
      anchors: Object.fromEntries(DEF_SUBJ.map(a=>[a[0],a[3]]))},
    days:{}, weeks:{}, months:{}, exams:[], emotions:[]};
}
function migrate(x){
  const f = fresh();
  x.settings = Object.assign(f.settings, x.settings||{});
  for (const k of ['days','weeks','months']) x[k] = x[k] || {};
  x.exams = x.exams || []; x.emotions = x.emotions || [];
  return x;
}
function load(){
  try { const s = localStorage.getItem(KEY); if (s) { DB = migrate(JSON.parse(s)); return; } } catch(e) {}
  DB = fresh();
  if (DEMO) { seedDemo(); save(true); }
}
let savedAt = null;
function save(quiet){
  try { localStorage.setItem(KEY, JSON.stringify(DB)); savedAt = new Date(); }
  catch(e) { toast('保存失败：浏览器存储不可用，请马上导出备份'); }
  const el = $('#savedAt'); if (el && savedAt) el.textContent = '已保存 '+pad(savedAt.getHours())+':'+pad(savedAt.getMinutes());
}
const subjects = () => DB.settings.subjects.filter(s=>!s.hidden);
const subjById = id => DB.settings.subjects.find(s=>s.id===id) || {id, name:id, color:'#888'};

function dayObj(d, create){ let x = DB.days[d]; if (!x && create) x = DB.days[d] = {subj:{}}; return x; }
function rec(d, sid, create){
  const dd = dayObj(d, create); if (!dd) return null;
  let r = dd.subj[sid];
  if (!r && create) r = dd.subj[sid] = {min:0, intr:'none', errs:{calc:0,concept:0,read:0}, tag:'', stuck:'', none:false};
  return r;
}
const errTotal = r => r && r.errs ? sum(ET.map(t=>r.errs[t.k]||0)) : 0;
function dayHasData(dd){
  if (!dd) return false;
  if (dd.mood || dd.answer || dd.note) return true;
  return Object.values(dd.subj||{}).some(r => r.none || r.min>0 || errTotal(r)>0 || r.stuck || (r.intr && r.intr!=='none'));
}

/* 锚点：取本周之前最近一次周复盘里定下的「下周锚点」，没有就用默认 */
function anchorsFor(mon){
  const ks = Object.keys(DB.weeks).filter(k => k < mon && DB.weeks[k].next).sort();
  const k = ks.pop();
  return Object.assign({}, DB.settings.anchors, k ? DB.weeks[k].next : {});
}

/* ---------------- 统计 ---------------- */
function stats(from, to){
  const S = {}; const days = range(from, to);
  let recDays = 0; const mood = {tired:[], ok:[], good:[]}; const errByDay = {};
  const tagsByType = {calc:{}, concept:{}, read:{}};
  for (const s of DB.settings.subjects) S[s.id] = {min:0, days:0, intrN:0, intr:{early:0,mid:0,late:0}, errs:{calc:0,concept:0,read:0}, tags:{}, stuck:[], byDay:{}, noneDays:0, recOn:0};
  for (const d of days) {
    const dd = DB.days[d];
    if (!dayHasData(dd)) continue;
    recDays++;
    let e = 0;
    for (const sid in dd.subj) {
      const r = dd.subj[sid]; const x = S[sid]; if (!x) continue;
      x.byDay[d] = r;
      if (r.none) { x.noneDays++; continue; }
      x.recOn++;
      if (r.min > 0) { x.min += r.min; x.days++; }
      if (r.intr && r.intr !== 'none') { x.intrN++; x.intr[r.intr]++; }
      const tags = splitTags(r.tag);
      for (const t of ET) {
        const n = r.errs && r.errs[t.k] || 0; x.errs[t.k] += n; e += n;
        for (const tg of tags) if (n) { x.tags[tg] = (x.tags[tg]||0) + n; tagsByType[t.k][tg+'｜'+subjById(sid).name] = (tagsByType[t.k][tg+'｜'+subjById(sid).name]||0) + n; }
      }
      if (r.stuck) x.stuck.push({d, sid, text:r.stuck});
    }
    errByDay[d] = e;
    if (dd.mood) mood[dd.mood].push(d);
  }
  const errs = {calc:0,concept:0,read:0};
  for (const sid in S) for (const t of ET) errs[t.k] += S[sid].errs[t.k];
  return {S, days, recDays, mood, errByDay, errs, errN: sum(Object.values(errs)), tagsByType, from, to};
}
const topEntries = (o, n) => Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0, n||3);

/* 观察发现：只描述模式，不下判决；比较对象是孩子自己的锚点和上一周期 */
function findings(st, prev, anchors, days){
  const out = []; const nDays = days || st.days.length;
  const need = Math.ceil(nDays * 4/7);
  if (st.recDays === 0) return [{k:'info', t:'这段时间还没有记录。'}];
  if (st.recDays < need) out.push({k:'info', t:`只记了 ${st.recDays} 天，下面的发现样本少，先当线索看，别当结论。`});
  for (const s of subjects()) {
    const x = st.S[s.id]; if (!x) continue;
    const a = anchors ? (anchors[s.id]||0) : 0;
    const avg = x.days ? x.min / x.days : 0;
    const intrRate = x.recOn ? x.intrN / x.recOn : 0;
    const eN = sum(Object.values(x.errs));
    const nm = `<b>${esc(s.name)}</b>`;
    if (a && x.days >= 3 && avg < a*0.7) {
      if (intrRate >= 0.4) {
        let t = `${nm} 平均每天 ${Math.round(avg)} 分钟，锚点 ${a} 分钟，少了 ${pct(a-avg,a)}%；${x.recOn} 天里 ${x.intrN} 天中途中断。用时短可能是卡住就换科，不一定是做得快。`;
        if (x.errs.concept >= Math.max(2, eN*0.4)) t += ` 这科的错题又以<b>概念混淆</b>为主（${x.errs.concept}/${eN}），两个信号指向同一处：概念没弄懂时就停下了。`;
        t += ` 可以问：「做到哪一步开始想换别的？」`;
        out.push({k:'signal', t});
      } else if (eN <= 1) {
        out.push({k:'good', t:`${nm} 平均 ${Math.round(avg)} 分钟，比锚点 ${a} 分钟少，没中断、错题也少——可能确实做得快。锚点可以不动，先观察一周。`});
      } else {
        out.push({k:'info', t:`${nm} 平均 ${Math.round(avg)} 分钟，比锚点 ${a} 分钟少 ${pct(a-avg,a)}%，但很少中断。可能锚点定高了，也可能作业量少。`});
      }
    } else if (a && x.days >= 3 && avg > a*1.4) {
      out.push({k:'info', t:`${nm} 平均 ${Math.round(avg)} 分钟，超出锚点 ${a} 分钟 ${pct(avg-a,a)}%。是作业量大，还是卡住了？看看卡点记录里有没有这科。`});
    }
    const early = x.intr.early;
    if (x.intrN >= 2 && early / x.intrN >= 0.6) {
      out.push({k:'signal', t:`${nm} 的中断有 ${early}/${x.intrN} 次发生在<b>前 15 分钟</b>。可能是启动困难：开头先放一道肯定能做对的小题，拿到一次小成功再往下。`});
    }
  }
  if (st.errN >= 4) {
    const top = ET.map(t=>[t, st.errs[t.k]]).sort((a,b)=>b[1]-a[1])[0];
    if (top[1] / st.errN >= 0.5) {
      const tg = topEntries(st.tagsByType[top[0].k], 2).filter(e=>e[1]>=2);
      let t = `错题 ${st.errN} 道，其中<b>${top[0].n}</b> ${top[1]} 道（${pct(top[1],st.errN)}%）`;
      if (tg.length) t += `，集中在 ` + tg.map(e=>{ const p=e[0].split('｜'); return `${esc(p[1])}「${esc(p[0])}」${e[1]} 道`; }).join('、');
      t += top[0].k==='calc' ? '。计算错误多通常靠固定格式的小练习解决，不用加量。' : top[0].k==='concept' ? '。概念混淆光刷题没用，要回到课本例题把那个概念讲一遍。' : '。审题失误可以试试「圈条件」：做题前先把已知条件圈出来。';
      out.push({k:'signal', t});
    }
  }
  if (prev && prev.recDays >= 3 && st.recDays >= 3) {
    for (const t of ET) {
      const a = st.errs[t.k] / st.recDays * 7, b = prev.errs[t.k] / prev.recDays * 7;
      if (b >= 2 && a <= b * 0.5) out.push({k:'good', t:`<b>${t.n}</b>比上一段少了（按 7 天折算 ${b.toFixed(1)} → ${a.toFixed(1)} 道），这类错误在减少。`});
      else if (a >= 3 && a >= b * 1.8 && a - b >= 2) out.push({k:'signal', t:`<b>${t.n}</b>比上一段多了（按 7 天折算 ${b.toFixed(1)} → ${a.toFixed(1)} 道）。先问是哪几道、卡在哪一步。`});
    }
  }
  const tired = st.mood.tired, others = st.days.filter(d => d in st.errByDay && !tired.includes(d));
  if (tired.length >= 2 && others.length >= 2) {
    const a = sum(tired.map(d=>st.errByDay[d]||0))/tired.length, b = sum(others.map(d=>st.errByDay[d]||0))/others.length;
    if (a >= 2 && a >= b * 1.5) out.push({k:'signal', t:`精神「困」的 ${tired.length} 天，平均每天错 ${a.toFixed(1)} 道，其他天 ${b.toFixed(1)} 道。先看睡眠，再看知识点。`});
  }
  const stuckN = sum(Object.values(st.S).map(x=>x.stuck.length));
  if (stuckN === 0 && st.recDays >= 3) out.push({k:'info', t:'卡点一条也没记。明晚试试只问一句：「哪一步最不确定？」孩子的回答本身就是诊断。'});
  if (!out.some(o=>o.k!=='info')) out.push({k:'good', t:'没有明显的异常信号。节奏稳住就是进展。'});
  return out;
}

  const L = 34, R = 12, T = 12, B = 28, n = xl.length;

  let s = `<svg class="chart" width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="考试得分率折线图">`;
  for (const g of [0,20,40,60,80,100]) s += `<line x1="${L}" x2="${W-R}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)" ${g===60?'stroke-dasharray="4 3"':''}/><text x="${L-6}" y="${Y(g)+4}" font-size="11" text-anchor="end">${g}</text>`;
  const step = Math.ceil(n / Math.max(1, Math.floor((W-L-R)/48)));
  xl.forEach((l,i) => { if (i % step === 0 || i === n-1) s += `<text x="${X(i)}" y="${H-8}" font-size="11" text-anchor="middle">${esc(l)}</text>`; });
  for (const se of series) {
    if (!se.pts.length) continue;
    s += `<polyline fill="none" stroke="${se.color}" stroke-width="2.2" stroke-linejoin="round" points="${se.pts.map(p=>X(p.i)+','+Y(p.y)).join(' ')}"/>`;
    for (const p of se.pts) s += `<circle cx="${X(p.i)}" cy="${Y(p.y)}" r="3.5" fill="${se.color}"><title>${esc(se.name)} ${xl[p.i]}：${p.v}（${Math.round(p.y)}%）</title></circle>`;
    const last = se.pts[se.pts.length-1];
    if (W > 420) s += `<text x="${Math.min(X(last.i)+6, W-R)}" y="${Y(last.y)-6}" font-size="11" style="fill:${se.color}">${esc(se.name)}</text>`;
  }
  return s + `</svg>`;
}
function stackBars(groups, W, H, share){
  const L = 42, R = 8, T = 16, B = 24, n = groups.length;
  const bw = Math.min(40, (W-L-R)/n*0.62), gap = (W-L-R)/n;
  const max = share ? 100 : Math.max(10, ...groups.map(g => sum(g.parts.map(p=>p.v))));
  const niceMax = share ? 100 : Math.ceil(max/30)*30;
  const Y = v => T + (niceMax - v)*(H-T-B)/niceMax;
  let s = `<svg class="chart" width="100%" viewBox="0 0 ${W} ${H}" role="img">`;
  const ticks = share ? [0,50,100] : [0, niceMax/2, niceMax];
  for (const g of ticks) s += `<line x1="${L}" x2="${W-R}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(g)+4}" font-size="11" text-anchor="end">${Math.round(g)}${share?'%':''}</text>`;
  groups.forEach((g, i) => {
    const x = L + gap*i + (gap-bw)/2; const tot = sum(g.parts.map(p=>p.v));
    let acc = 0;
    for (const p of g.parts) { if (!p.v) continue; const v = share ? p.v/tot*100 : p.v; s += `<rect x="${x}" y="${Y(acc+v)}" width="${bw}" height="${Math.max(0, Y(acc)-Y(acc+v)-1)}" fill="${p.c}" rx="2"/>`; acc += v; }
    s += `<text x="${x+bw/2}" y="${H-7}" font-size="11" text-anchor="middle">${esc(g.label)}</text>`;
    const top = share ? g.top : Math.round(tot);
    if (tot) s += `<text x="${x+bw/2}" y="${Y(acc)-4}" font-size="10.5" text-anchor="middle">${top}</text>`;
  });
  return s + `</svg>`;
}

function seedDemo(){
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd()*a.length)];
  const t = today(); const start = addD(t, -48);
  DB.settings.child = '小周';
  for (const d of range(start, t)) {
    if (rnd() < 0.12) continue;
    const dd = DB.days[d] = {subj:{}, mood: pick(['ok','ok','good','tired'])};
    const wk = Math.floor((P(d) - P(start)) / 864e5 / 7);
    for (const s of DB.settings.subjects) {
      if (['df','ls','dl','sw'].includes(s.id) && rnd() < 0.5) { dd.subj[s.id] = {none:true, min:0, intr:'none', errs:{calc:0,concept:0,read:0}}; continue; }
      const base = DB.settings.anchors[s.id];
      let min = Math.round((base * (0.8 + rnd()*0.5))/5)*5, intr = 'none';
      const e = {calc:0,concept:0,read:0}; let tag = '', stuck = '';
      if (s.id === 'sx') {
        const improving = wk >= 4;
        if (rnd() < (improving ? 0.25 : 0.6)) { intr = rnd() < 0.75 ? 'early' : 'mid'; min = Math.round(base*(0.45+rnd()*0.2)/5)*5; }
        e.concept = rnd() < (improving ? 0.3 : 0.7) ? 1 + Math.floor(rnd()*2) : 0;
        e.calc = rnd() < 0.5 ? 1 : 0;
        tag = pick(['有理数混合运算','去括号','有理数混合运算','一元一次方程移项']);
        if (rnd() < 0.4) stuck = pick(['去括号的时候后面的项要不要变号','负数乘方那一步','移项不知道要不要变号','行程题不知道用相遇还是追及']);
      } else if (s.id === 'yy') {
        e.read = rnd() < 0.4 ? 1 : 0; e.calc = 0; e.concept = rnd() < 0.3 ? 1 : 0;
        tag = pick(['一般现在时三单','完形填空','be动词']);
        if (rnd() < 0.2) stuck = '第 5 空在 which 和 that 之间犹豫';
      } else if (s.id === 'yw') {
        e.read = rnd() < 0.35 ? 1 : 0; tag = pick(['阅读理解','古诗默写']);
        if (rnd() < 0.2) stuck = '说明方法那道题看不出是举例子还是列数字';
      } else { e.concept = rnd() < 0.15 ? 1 : 0; }
      dd.subj[s.id] = {min, intr, errs:e, tag: (e.calc+e.concept+e.read) ? tag : '', stuck};
    }
    if (rnd() < 0.3) dd.answer = pick(['数学第三题第二步','英语作文开头不会写','今天都还行','去括号那里']);
  }
  const m0 = monOf(start);
  DB.weeks[addD(m0,7)] = {found:'数学中断都在前15分钟，错题以概念混淆为主，卡在去括号', adjust:'数学开头先做 2 道会做的去括号小题', next:{sx:40}};

    {id:'e2', date:addD(start,24), name:'第一单元测验', type:'单元测验', scores:{yw:{s:80,full:100},sx:{s:58,full:100,loss:{calc:10,concept:20,read:12}},yy:{s:84,full:100}}},
    {id:'e3', date:addD(start,40), name:'第一次月考', type:'月考', scores:{yw:{s:82,full:100},sx:{s:66,full:100,loss:{calc:10,concept:14,read:10}},yy:{s:83,full:100},df:{s:41,full:50},ls:{s:43,full:50}}, rankClass:'28', adjust:'数学概念题回到课本例题；英语保持'},
  ];
  DB.emotions = [

    {id:'m2', date:addD(start,9), trigger:'看到走神', level:4, paused:false},
