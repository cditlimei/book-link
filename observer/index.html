<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="每日观察">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f1e8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>每日观察</title>
<style>
/* ============================================================
   每日观察 v2
   依据：《陪考手记》第 12 章四件工具 + 2026-09 证据调研
   - 回忆练习 g≈0.6（Adesope 2017）→ 错题逐题记录，按 2/7/21 天排「盖住答案重做」
   - 有把握却做错的题改正后最牢（Metcalfe 2017）→ 每道错题记信心，优先重做
   - 学生自我监控 g=0.47 → 孩子自己计时自己填，家长只问一句
   - 初中家长干涉型参与与数学成绩负相关（Patall 2008 / 2023 meta）→ 不做家长批改打分
   - 深圳 2026 中考 630 分结构 → 默认满分、提分空间按中考权重算
   视觉：观察笔记本。纸色底 + 墨色字，错题用琥珀不用红——它是待返回的线索，不是审判。
   ============================================================ */
:root{
  --bg:#f5f1e8; --surface:#fffdf8; --surface2:#efe9dc; --surface3:#f8f4ec;
  --ink:#2b2621; --ink2:#6e665c; --ink3:#a0978a; --line:#e4dccd;
  --accent:#2f5d8a; --accent-bg:#e4ecf4;
  --amber:#a8681a; --amber-bg:#f7ead5;
  --good:#3d7a5c; --good-bg:#e1efe6;
  --danger:#a8423a;
  --shadow:0 1px 2px rgba(60,45,20,.05),0 4px 14px rgba(60,45,20,.05);
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:16px; --tabh:62px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#171614; --surface:#211f1c; --surface2:#2d2a26; --surface3:#1c1a18;
  --ink:#ece6db; --ink2:#b1a898; --ink3:#7d7568; --line:#38342f;
  --accent:#8cb4dc; --accent-bg:#233142;
  --amber:#e0a656; --amber-bg:#3a2e1d;
  --good:#7fc39f; --good-bg:#1f3328;
  --danger:#e08078; --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
body{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 20px)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

#top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:880px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:.02em}
.term{font-size:13px;color:var(--ink2)}
.syncst{margin-left:auto;font-size:12px;color:var(--ink3);white-space:nowrap;border:0;background:transparent;padding:4px 0}
.syncst.err{color:var(--amber)}
.demo-banner{background:var(--amber-bg);color:var(--amber);font-size:13px;text-align:center;padding:6px 16px}

main{max-width:880px;margin:0 auto;padding:16px}
h2{font-family:var(--serif);font-size:23px;margin:2px 0 4px;letter-spacing:.01em}
h3{font-family:var(--serif);font-size:17px;margin:0 0 8px}
.sub{color:var(--ink2);font-size:14px;margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.cols{display:grid;grid-template-columns:1fr;gap:0 16px}
@media (min-width:760px){.cols{grid-template-columns:1.25fr 1fr}}

.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;line-height:1.2;min-height:34px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.soft.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:14px;min-height:36px;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg.sm button{padding:4px 9px;min-height:30px;font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-size:15px;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary,.btn.good{color:#10161d}}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.sm{padding:5px 10px;min-height:34px;font-size:14px}
input[type=text],input[type=number],input[type=date],input[type=password],textarea,select{width:100%;border:1px solid var(--line);background:var(--surface3);border-radius:10px;padding:9px 11px;font-size:16px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:var(--surface)}
textarea{min-height:64px;resize:vertical;line-height:1.5}
label.f{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface3)}
.stepper button{border:0;background:transparent;width:38px;height:38px;font-size:20px;line-height:1;color:var(--ink2)}
.stepper .v{min-width:44px;text-align:center;font-family:var(--mono);font-size:16px}
.tip{background:var(--accent-bg);border-radius:var(--r);padding:12px 14px;font-size:14px;margin-bottom:12px}
.tip b{color:var(--accent)}
.signal{background:var(--amber-bg);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14.5px}
.signal.good{background:var(--good-bg)}
.signal.info{background:var(--surface2)}
.signal .k{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--amber);display:block;margin-bottom:2px}
.signal.good .k{color:var(--good)} .signal.info .k{color:var(--ink2)}
.empty{color:var(--ink3);font-size:14px;padding:18px 4px;text-align:center}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.accent{background:var(--accent-bg);color:var(--accent)}
.pill.good{background:var(--good-bg);color:var(--good)}

/* 首页 hero */
.hero{padding:14px 16px 12px}
.hero-top{display:flex;align-items:center;gap:8px}
.hero .d{font-family:var(--serif);font-size:24px;font-weight:700;line-height:1.2}
.hero .w{color:var(--ink2);font-size:13px}
.navbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;color:var(--ink2);flex:none}
.navbtn:disabled{opacity:.3}
.rhythm{text-align:right;line-height:1.1}
.rhythm b{font-family:var(--mono);font-size:26px;color:var(--accent)}
.rhythm span{display:block;font-size:11.5px;color:var(--ink3)}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wstrip button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink3);padding:2px 0}
.wstrip i{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--mono);font-size:12px;color:var(--ink2)}
.wstrip .rec i{background:var(--accent-bg);border-color:var(--accent-bg);color:var(--accent)}
.wstrip .sel i{border-color:var(--ink);border-width:2px}
.wstrip .fut{opacity:.35}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:2px;min-height:74px;box-shadow:var(--shadow)}
.step .n{font-size:12px;color:var(--ink3)}
.step .t{font-weight:600;font-size:14.5px}
.step .s{font-size:12.5px;color:var(--ink2)}
.step.done{background:var(--good-bg);border-color:transparent;box-shadow:none}
.step.done .s{color:var(--good)}

/* 科目列表 */
.slist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
.slist-h{padding:12px 16px 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sr{border-top:1px solid var(--line)}
.sr-h{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 16px;min-height:58px;cursor:pointer}
.sr-name{font-weight:600;font-size:16.5px;min-width:3em}
.sr-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
.sr-min{font-family:var(--mono);font-size:15px;min-width:38px;text-align:right}
.sr.none .sr-name,.sr.none .sr-min{color:var(--ink3)}
.sr.open{background:var(--surface3)}
.sr-body{padding:2px 16px 16px}
.sr .line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.sr .lab{font-size:13px;color:var(--ink2);width:64px;flex:none}
@media (max-width:520px){.sr .lab{width:100%}}
.tbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--accent)}
.tbtn svg{width:16px;height:16px;fill:currentColor}
.tbtn.run{background:var(--accent);border-color:var(--accent);color:#fff}
.timerbar{display:flex;align-items:center;gap:8px;background:var(--accent-bg);border-radius:12px;padding:8px 10px}
.timerbar .clock{font-family:var(--mono);font-size:22px;color:var(--accent);min-width:78px}
.addrow{display:flex;gap:6px;flex-wrap:wrap}
.addrow button{border:1px dashed var(--ink3);background:var(--surface);border-radius:10px;padding:7px 11px;font-size:14px;min-height:38px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.item .it{font-size:13px;font-weight:600;white-space:nowrap}
.item input{padding:6px 9px;font-size:15px}
.item .cf{grid-column:1/-1}
.x{border:0;background:transparent;color:var(--ink3);font-size:20px;width:32px;height:32px}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink2);font-size:12.5px;white-space:nowrap}
td:first-child{white-space:nowrap}
td.wrap{min-width:140px}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}

.wk{display:grid;grid-template-columns:52px repeat(7,1fr) 62px;gap:3px;font-size:12.5px}
.wk .hd{color:var(--ink3);text-align:center;padding:2px 0}
.wk .sn{display:flex;align-items:center;gap:5px;font-weight:600;font-size:13px;overflow:hidden;white-space:nowrap}
.wk .c{position:relative;height:34px;border-radius:6px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);color:var(--ink)}
.wk .c.blank{background:transparent;color:var(--ink3)}
.wk .c .intr{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.wk .c .e{position:absolute;bottom:1px;right:4px;font-size:9.5px;color:var(--amber);font-weight:600}
.wk .tot{text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink2);display:flex;flex-direction:column;justify-content:center;line-height:1.25}

.redo{border-left:4px solid var(--line)}
.redo.sure{border-left-color:var(--amber)}
.redo .q{font-family:var(--serif);font-size:18px;margin:8px 0 4px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:var(--mono);font-size:24px;line-height:1.2}
.kpi span{font-size:12.5px;color:var(--ink2)}

.exam-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.exam-name{font-weight:700;font-size:16px}
.tag{font-size:12px;border-radius:6px;padding:1px 7px;background:var(--surface2);color:var(--ink2)}
.tag.big{background:var(--accent-bg);color:var(--accent)}
.scores{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sc{border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:13.5px;display:flex;align-items:baseline;gap:5px}
.sc .v{font-family:var(--mono);font-size:15px;font-weight:600}
.up{color:var(--good)} .down{color:var(--amber)}
.examform .srow{display:grid;grid-template-columns:64px 1fr 1fr;gap:8px;align-items:center;margin-bottom:6px}
.examform .loss{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;padding:0 0 8px 64px}
.examform .loss label{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:4px}
.examform .loss input{width:52px;padding:5px 6px;font-size:14px}
@media (max-width:520px){.examform .loss{padding-left:0}}

.terms{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.terms div{border-radius:8px;background:var(--surface2);padding:8px 4px;text-align:center;font-size:12.5px;color:var(--ink2)}
.terms div.now{background:var(--accent);color:#fff}
.terms div.past{background:var(--accent-bg);color:var(--accent)}
.terms b{display:block;font-family:var(--mono);font-size:15px}
.ms{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ms .when{width:84px;flex:none;color:var(--ink2);font-size:13px}

#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabin{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);height:var(--tabh)}
.tabin button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--ink3);position:relative}
.tabin button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabin button.on{color:var(--accent)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--amber);color:#fff;border-radius:999px;font-size:10.5px;min-width:17px;height:17px;line-height:17px;padding:0 4px;font-family:var(--mono);font-style:normal}
#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw}
#toast.show{opacity:1}
svg.chart text{font-family:var(--sans);fill:var(--ink2)}
details>summary{cursor:pointer}
.methods td:first-child{white-space:nowrap;font-weight:600}
ol.guide{padding-left:20px;margin:6px 0;font-size:14px} ol.guide li{margin:4px 0}

.mic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;flex:none}
.mic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.mic.rec{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}
.withmic{display:flex;gap:8px;align-items:flex-start}.withmic > textarea,.withmic > input{flex:1}
#printbox{display:none}
@media print{
  body{background:#fff;color:#000;padding:0}
  body > *:not(#printbox){display:none !important}
  #printbox{display:block;font-family:var(--sans);font-size:12pt;line-height:1.5;color:#000}
  #printbox h1{font-family:var(--serif);font-size:20pt;margin:0 0 2pt}
  #printbox h2{font-family:var(--serif);font-size:15pt;margin:16pt 0 4pt;border-bottom:1.5pt solid #000;padding-bottom:2pt}
  #printbox h2 span{font-size:10pt;font-weight:400;color:#555;font-family:var(--sans)}
  #printbox h3{font-size:12pt;margin:10pt 0 4pt;color:#333}
  #printbox .pm,#printbox .pmeta{font-size:9.5pt;color:#555}
  #printbox .pi{break-inside:avoid;padding:6pt 0;border-bottom:.5pt dashed #999}
  #printbox .pq{font-size:12.5pt}
  #printbox .pblank{height:70pt}
  #printbox .pblank.sm{height:40pt;font-size:9pt;color:#888}
  #printbox .pbreak{break-before:page}
}

/* 一步一步填：全屏、一次只问一件事、大按钮、点完自动下一步 */
.wiz{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.wiz-top{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;max-width:680px;margin:0 auto;width:100%}
.wiz-dots{display:flex;gap:4px;flex:1}
.wiz-dots i{flex:1;height:6px;border-radius:3px;background:var(--surface2)}
.wiz-dots i.done{background:var(--accent)} .wiz-dots i.cur{background:var(--ink)}
.wiz-x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;color:var(--ink2)}
.wiz-body{flex:1;overflow:auto;padding:8px 20px 20px;max-width:680px;margin:0 auto;width:100%;-webkit-overflow-scrolling:touch}
.wiz-subj{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink2);margin:10px 0 2px}
.wiz-subj .dot{width:12px;height:12px}
.wiz-q{font-family:var(--serif);font-size:27px;font-weight:700;margin:2px 0 18px;line-height:1.3}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.big.two{grid-template-columns:1fr 1fr}
.big button{min-height:70px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-size:21px;font-weight:600;box-shadow:var(--shadow);color:var(--ink);padding:6px}
.big button small{display:block;font-size:12.5px;font-weight:400;color:var(--ink3);margin-top:2px}
.big button.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.big button.wide{grid-column:1/-1;min-height:56px;font-size:18px}
.big button.soft{color:var(--ink2);font-weight:500}
.cnt{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.cnt .nm{flex:1;font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}

<body>

<script>
'use strict';
/* ================= 常量 ================= */
const ET = [{k:'calc',n:'计算·书写',s:'执行'},{k:'concept',n:'概念·理解',s:'理解'},{k:'read',n:'审题·表达',s:'审题'}];
const ET_COLOR = {calc:'#c0822a',concept:'#8a5a9e',read:'#2f8a8a'};
const ETN = Object.fromEntries(ET.map(t=>[t.k,t.n]));
const CONF = [{k:'sure',n:'有把握'},{k:'unsure',n:'不太确定'},{k:'no',n:'不会'}];
const CONFN = {sure:'做的时候有把握', unsure:'做的时候不太确定', no:'做的时候就不会'};
const LOSS = ET.concat([{k:'time',n:'时间不够',s:'时间'},{k:'gap',n:'没复习到',s:'没复习'}]);
const INTR = [{k:'none',n:'没中断'},{k:'early',n:'前15分钟'},{k:'mid',n:'中间'},{k:'late',n:'快结束'}];
const MOOD = [{k:'tired',n:'困'},{k:'ok',n:'一般'},{k:'good',n:'精神好'}];
const EXAM_T = ['单元测验','周测','月考','期中','期末','区质检','模拟考','其他'];
const BIG = ['期中','期末','区质检','模拟考'];
const PREP = ['重做了错题','看了课本例题','刷了练习卷','背了知识点','没怎么准备'];
const BOXES = [2, 7, 21];                 // 第 1/2/3 次重做的间隔天数；第 3 次做对 = 掌握
const DAILY_REDO = 3;                     // 每天最多推 3 道，放得进 10 分钟
/* id, 名称, 颜色, 默认锚点分钟, 深圳中考满分, 起始学期, 结束学期(0=七上…5=九下), 计入中考总分 */
const DEF_SUBJ = [
  ['yw','语文','#b5523b',30,120,0,5,true], ['sx','数学','#2f5d8a',40,100,0,5,true], ['yy','英语','#3d7a5c',30,100,0,5,true],
  ['df','道法','#8a5a9e',10,50,0,5,true], ['ls','历史','#9c7a2b',10,70,0,5,true],
  ['dl','地理','#2f8a8a',10,50,0,3,false], ['sw','生物','#6b8a2f',10,50,0,3,false],
  ['wl','物理','#a0527a',30,70,2,5,true], ['hx','化学','#5a6fa0',20,50,4,5,true]];
const TERM_N = ['七上','七下','八上','八下','九上','九下'];
const EXTRA_COLORS = ['#7a6b5a','#a06b3a','#4f8a6b','#6b5aa0'];
const QUESTIONS = [
  '今天做的题里，哪一步你最不确定？', '这道题卡在哪一步？（不问「为什么又错」）', '今天哪一科做得最顺？顺在哪？',
  '读的时候，哪一句最费劲？', '选的时候，哪个空最犹豫？', '做到哪一步开始想换别的科目？',
  '最近做数学题，是不是觉得特别累？', '今天有没有一道题，是一开始不会、后来弄明白的？', '如果明天再做一遍，你会先改哪一步？'];
const TRIGGERS = ['看到走神','同一题型重复犯错','说「我知道了」但在敷衍','想到别人家孩子','成绩或排名出来','老师在群里点名','拖到很晚还没写完','顶嘴或不耐烦'];
const MINS = [10,20,30,45,60,90];
/* 分学科错因体系：三个大类的内部 key 不变（calc/concept/read，统计与同步兼容），每科有自己的叫法和具体问题。
   依据《陪考手记》第 7/9/10/11/16 章；b:1 = 书中原有，b:0 = 书中未提、按书的逻辑补的建议。 */
const TAX = {
  sx: {name:'数学', calc:{n:'运算执行', s:'运算', subs:[
        ['cf-fu','乘方负号','(-2)³ 写成 8，或把 -2² 和 (-2)² 弄混',1], ['fu-fu','同号异号搞反','(-5)×(-5) 写成 -25',1],
        ['kuohao','去括号只变第一项','括号前是减号，只给第一项变了号',1], ['duobu','多步题掉符号','2 步的题都对，3 步以上才错',1], ['kousuan','口算算错 / 抄错数','方法对，数字算错或抄错',0]]},
      concept:{n:'概念理解', s:'概念', subs:[
        ['yiju','说不出依据','问「这一步的依据是什么」，只会说「规则就是这样」',1], ['yixiang','移项 / 等式性质','把移项当成「移过去变号」',1],
        ['gongshi','公式认得但不敢用','宁可一步步硬算',1], ['qufenmu','去分母','分不清乘最小公倍数还是直接约分',1], ['fangfa','方法不会','无从下手',0]]},
      read:{n:'审题习惯', s:'审题', subs:[
        ['daozhi','数量关系倒置','把「比」字前后的量弄反',1], ['she','不会设未知数','读懂了题，不知道 x 设成什么',1],
        ['dengliang','找不到等量关系','题目一长就列不出方程',1], ['louting','漏看条件 / 单位','没圈关键词',1], ['tixing','题型没认出','比如相遇和追及分不清',0]]},
      ask:['你当时是怎么想的？讲每一步怎么想，不是讲步骤。','这一步的依据是什么？（让他自己翻课本找定义）','是忘了要变号，还是知道要变号但算错了？','是读不懂题目，还是读懂了但不知道怎么列方程？'],
      next:{calc:'做同类变式小题，固定格式，不加量', concept:'回课本找定义和例题，让孩子自己讲一遍依据；缺口可能在小学（运算律）', read:'只写等量关系、设未知数，不求解——专练建模'}},
  yw: {name:'语文', calc:{n:'积累·书写', s:'积累', subs:[
        ['cuozi','错别字 / 字词','写错字，或词义不会',0], ['moxie','古诗文默写','漏字、错字、背不出',0], ['yubing','语病','病句没改对，或自己写出病句',1]]},
      concept:{n:'文本理解', s:'理解', subs:[
        ['wenyan','文言实词 / 句子','翻译不对',0], ['zhao','阅读找不准答案','找到的句子不是答案要的',1],
        ['gaikuo','概括不清','复述时讲不清情节',1], ['xijie','细节没筛出来','说不出文中具体细节',1], ['pingjia','讲不出看法','评价、探究题没有自己的观点',1]]},
      read:{n:'写作表达', s:'表达', subs:[
        ['miaoxie','描写不具体','语言缺乏表现力',1], ['taiduan','开放题答得太短','只写了两行，要点不全',1], ['shenti','答非所问','没看清题干要求或分值',0]]},
      ask:['那个人物 / 那段话里有什么细节？（练筛选信息）','他从什么时候开始改变主意的？（练推理）','你觉得最让你意外的是什么？（练评价，回答后不纠正）'],
      next:{calc:'固定时间积累：字词、默写小本，每天几个就够', concept:'口头复述：讲情节→讲细节→讲看法，家长只接住一个细节回应，不讲题', read:'每天三句话日记，低门槛练笔'}},
  yy: {name:'英语', calc:{n:'拼写', s:'拼写', subs:[
        ['pinxie','会认不会拼','读的时候认识，写的时候拼不出',1], ['xingshi','大小写 / 单复数 / 标点','形式写错',0]]},
      concept:{n:'语法·词汇', s:'语法词汇', subs:[
        ['weiyu','缺谓语','句子里没有动词',1], ['shitai','时态错','动词时态混乱',1], ['yuxu','中文语序','按中文顺序排单词',1],
        ['shengci','生词','不认识这个词',1], ['dapei','固定搭配 / 介词','短语、介词用错',0]]},
      read:{n:'听说·审题', s:'听说', subs:[
        ['tinglou','听漏词','生词或连读处没听出',1], ['kaikou','只蹦单词','说不成完整句子',1], ['shangxia','完形 / 阅读没看上下文','没找前后文线索',0], ['yaoqiu','没看清题目要求','',0]]},
      ask:['能听懂，为什么写不出来？','今天听、说、读、写各练了哪项？','用完整的句子说一遍？'],
      next:{calc:'写的时候认不出的词，单独拎出来拼 3 遍', concept:'先仿写 3–5 句同结构的句子，再改写', read:'精听：1 分钟以内的材料听 4 遍；复述要求完整句子'}}
};
const taxOf = sid => TAX[sid] || null;
const typeName = it => { const t = taxOf(it.sid); return t ? t[it.type].n : ETN[it.type]; };
const typeNameS = (sid, k) => { const t = taxOf(sid); return t ? t[k].n : ETN[k]; };
const typeShortS = (sid, k) => { const t = taxOf(sid); return t ? t[k].s : ET.find(x=>x.k===k).s; };
const subName = it => { const t = taxOf(it.sid); if (!t || !it.sub) return ''; const x = t[it.type].subs.find(a => a[0] === it.sub); return x ? x[1] : ''; };
/* 拍照错题本 errorType → 数学具体问题 */
const EXT_SUB = {cuxin:'kousuan', fufenshu:'kousuan', buzhou:'duobu', fuhao:'fu-fu', kuohao:'kuohao', dishu:'cf-fu', gainian:'yiju', fangfa:'fangfa', shenti:'louting', biaoda:'louting'};

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const P = s => { const a = s.split('-').map(Number); return new Date(a[0], a[1]-1, a[2]||1); };
const addD = (s,n) => { const d = P(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const monOf = s => { const d = P(s); d.setDate(d.getDate() - (d.getDay()+6)%7); return ymd(d); };
const mKey = s => s.slice(0,7);
const addM = (m,n) => { const d = P(m+'-01'); d.setMonth(d.getMonth()+n); return ymd(d).slice(0,7); };
const monthEnd = m => { const d = P(m+'-01'); d.setMonth(d.getMonth()+1); d.setDate(0); return ymd(d); };
const dayDiff = (a,b) => Math.round((P(b)-P(a))/864e5);
const WD = '日一二三四五六';
const md = s => { const d = P(s); return (d.getMonth()+1)+'月'+d.getDate()+'日'; };
const mdShort = s => { const d = P(s); return (d.getMonth()+1)+'/'+d.getDate(); };
const wd = s => '周'+WD[P(s).getDay()];
const sum = a => a.reduce((x,y)=>x+y,0);
const pct = (a,b) => b ? Math.round(a*100/b) : 0;
const range = (from,to) => { const r=[]; for(let d=from; d<=to; d=addD(d,1)) r.push(d); return r; };
const splitTags = s => String(s||'').split(/[,，、;；\s]+/).map(x=>x.trim()).filter(Boolean);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const now = () => Date.now();
const topEntries = (o, n) => Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0, n||3);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2000); }
const hm = ts => { const d = new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); };

/* 学段：9–1 月上学期，2–6 月下学期，7–8 月暑假 */
function termOf(s, startYear){
  const d = P(s), y = d.getFullYear(), m = d.getMonth()+1, G = ['七','八','九'];
  let g, t;
  if (m >= 9) { g = y - startYear; t = '上'; } else if (m <= 1) { g = y-1-startYear; t = '上'; }
  else if (m <= 6) { g = y-1-startYear; t = '下'; } else { g = y-1-startYear; t = '暑'; }
  if (g < 0) return {idx:-1, cidx:0, label:'入学前'};
  if (g > 2) return {idx:6, cidx:5, label:'初中毕业后'};
  const idx = g*2 + (t === '上' ? 0 : 1);
  return {idx, cidx:idx, label: t === '暑' ? G[g]+'年级暑假' : G[g]+'年级'+t+'学期'};
}

/* ================= 存储：IndexedDB 为主 + localStorage 镜像 ================= */
const QS = new URLSearchParams(location.search);
const DEMO = QS.has('demo');
const K_DB = DEMO ? 'observer:db-demo' : 'observer:db';
const K_SYNC = 'observer:sync';
const LEGACY = 'observer-v1';
let DB, SYNC = {}, loadedFrom = null;
const IDB = {
  db: null,
  open(){ if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => { try { const r = indexedDB.open('observer-app', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); } catch(e) { rej(e); } }); },
  async get(k){ try { const db = await this.open(); return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch(e) { return undefined; } },
  async del(k){ try { const db = await this.open(); await new Promise((res, rej) => { const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch(e) {} },
  async set(k, v){ try { const db = await this.open(); await new Promise((res, rej) => { const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); return true; } catch(e) { return false; } }
};
const lsGet = k => { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch(e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e) { return false; } };

function fresh(){
  return {v:2, u:0,
    settings:{u:0, child:'儿子', startYear:2026, pin:'', lastBackup:null, useExt:true,
      subjects: DEF_SUBJ.map(a=>({id:a[0],name:a[1],color:a[2],zk:a[4],from:a[5],to:a[6],inTotal:a[7],mode:'auto'})),
      anchors: Object.fromEntries(DEF_SUBJ.map(a=>[a[0],a[3]]))},
    days:{}, weeks:{}, months:{}, extReview:{}, items:[], exams:[], emotions:[], photos:[], del:{}, timer:null};
}
function migrate(x){
  const f = fresh();
  x.settings = Object.assign({}, f.settings, x.settings||{});
  x.settings.anchors = Object.assign({}, f.settings.anchors, x.settings.anchors||{});
  for (const k of ['days','weeks','months','del','extReview']) x[k] = x[k] || {};
  for (const k of ['items','exams','emotions','photos']) x[k] = x[k] || [];
  // 科目：补默认字段与新科目（物理/化学），v1 的 hidden → mode
  const subs = x.settings.subjects || [];
  for (const s of subs) { const d = DEF_SUBJ.find(a=>a[0]===s.id);
    if (s.mode == null) s.mode = s.hidden ? 'off' : 'auto'; delete s.hidden;
    if (d) { if (s.zk == null) s.zk = d[4]; if (s.from == null) s.from = d[5]; if (s.to == null) s.to = d[6]; if (s.inTotal == null) s.inTotal = d[7]; }
    else { if (s.from == null) s.from = 0; if (s.to == null) s.to = 5; if (s.zk == null) s.zk = 100; if (s.inTotal == null) s.inTotal = false; } }
  for (const d of DEF_SUBJ) if (!subs.find(s=>s.id===d[0])) subs.push({id:d[0],name:d[1],color:d[2],zk:d[4],from:d[5],to:d[6],inTotal:d[7],mode:'auto'});
  x.settings.subjects = subs;
  // v1 错题计数 → v2 逐题条目（没有信心记录）
  if ((x.v||1) < 2) {
    for (const d in x.days) { const dd = x.days[d]; for (const sid in (dd.subj||{})) { const r = dd.subj[sid];
      const tag = splitTags(r.tag)[0] || '';
      if (r.errs) for (const t of ET) for (let i = 0; i < (r.errs[t.k]||0); i++)
        x.items.push({id:uid('i'), d, sid, type:t.k, conf:null, tag, box:0, due:addD(d, BOXES[0]), hist:[], done:false, u:now()});
      delete r.errs; delete r.tag; } }
    x.v = 2;
  }
  x.u = x.u || 0;
  return x;
}
async function load(){
  const cands = [[await IDB.get(K_DB), 'idb'], [lsGet(K_DB), 'ls']];
  if (!DEMO) cands.push([lsGet(LEGACY), 'legacy']);
  // 先比修改时间，时间相同（旧版没有 u）比内容多少，防止空库盖掉有数据的旧版
  const size = x => Object.keys(x.days||{}).length + (x.items||[]).length + (x.exams||[]).length;
  const best = cands.filter(c => c[0]).sort((a,b) => ((b[0].u||0)-(a[0].u||0)) || (size(b[0]) - size(a[0])))[0];
  if (best) { DB = migrate(best[0]); loadedFrom = best[1]; }
  else { DB = fresh(); if (DEMO) { seedDemo(); DB = migrate(DB); } }
  SYNC = (await IDB.get(K_SYNC)) || lsGet(K_SYNC) || {};
  if (DEMO) SYNC = {};
}
let writeT = null, pendingLocal = false;
function save(){
  DB.u = now(); pendingLocal = true;
  clearTimeout(writeT); writeT = setTimeout(flush, 250);
  scheduleSync();
}
function flush(){
  clearTimeout(writeT); if (!pendingLocal) return; pendingLocal = false;
  const ok1 = lsSet(K_DB, DB);
  IDB.set(K_DB, JSON.parse(JSON.stringify(DB))).then(ok2 => { if (!ok1 && !ok2) toast('保存失败：浏览器存储不可用，请马上导出备份'); });
}
const saveSync = () => { if (DEMO) return; IDB.set(K_SYNC, SYNC); lsSet(K_SYNC, SYNC); };
window.addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { flush(); if (syncT) syncNow(); } });

/* ================= 数据访问 ================= */
const subjById = id => DB.settings.subjects.find(s=>s.id===id) || {id, name:id, color:'#888', zk:100};
function subjActive(s, d){
  if (s.mode === 'on') return true; if (s.mode === 'off') return false;
  const t = termOf(d || today(), DB.settings.startYear).cidx; return t >= s.from && t <= s.to;
}
const subjects = d => DB.settings.subjects.filter(s => subjActive(s, d));
/* 今天页和向导里：最近 3 周常有作业的科目排前面（稳定排序，没数据时保持原顺序） */
function orderedSubjects(d){
  const f = {};
  for (const x of range(addD(d,-21), addD(d,-1))) { const dd = DB.days[x]; if (dd) for (const sid in dd.subj) { const r = dd.subj[sid]; if (!r.none && r.min > 0) f[sid] = (f[sid]||0) + 1; } }
  return subjects(d).slice().sort((a,b) => (f[b.id]||0) - (f[a.id]||0));
}
const filledRec = r => r && (r.none || r.min > 0);
function dayObj(d, create){ let x = DB.days[d]; if (!x && create) x = DB.days[d] = {subj:{}, u:now()}; return x; }
function touchDay(d){ const x = dayObj(d, true); x.u = now(); return x; }
function setDayField(d, f, v){ const x = touchDay(d); x[f] = v; x.fu = x.fu || {}; x.fu[f] = now(); return x; }
function rec(d, sid, create){
  const dd = create ? touchDay(d) : dayObj(d); if (!dd) return null;
  let r = dd.subj[sid];
  if (!r && create) r = dd.subj[sid] = {min:0, intr:'none', stuck:'', none:false};
  if (create) r.u = now();            // 调用 create=true 的地方都是要改这条记录
  return r;
}
let IDX = {};
function reindex(){ IDX = {}; for (const it of DB.items) (IDX[it.d] = IDX[it.d] || []).push(it); }
const itemsOn = (d, sid) => (IDX[d] || []).filter(it => !sid || it.sid === sid);
function dayHasData(d){
  if (itemsOn(d).length) return true;
  const dd = DB.days[d]; if (!dd) return false;
  if (dd.mood || dd.answer || dd.note) return true;
  return Object.values(dd.subj||{}).some(r => r.none || r.min>0 || r.stuck || (r.intr && r.intr!=='none'));
}
function anchorsFor(mon){
  const ks = Object.keys(DB.weeks).filter(k => k < mon && DB.weeks[k].next).sort();
  const k = ks.pop();
  return Object.assign({}, DB.settings.anchors, k ? DB.weeks[k].next : {});
}
function delRec(kind, id){ DB[kind] = DB[kind].filter(x => x.id !== id); DB.del[id] = now(); }

/* 记录节奏：指数平滑（半衰期 7 天），断一两天不会清零——借鉴 Loop Habit Tracker 的习惯强度 */
function rhythm(){
  const ds = Object.keys(DB.days).concat(Object.keys(IDX)).sort(); if (!ds.length) return null;
  const first = ds[0], t = today(); if (dayDiff(first, t) < 2) return null;
  const a = 1 - Math.pow(0.5, 1/7); let s = 0;
  for (const d of range(first, t)) s = s*(1-a) + a*(dayHasData(d) ? 1 : 0);
  return Math.round(s*100);
}

/* ================= 统计 ================= */
function stats(from, to){
  const S = {}; const days = range(from, to);
  let recDays = 0; const mood = {tired:[], ok:[], good:[]}; const errByDay = {};
  const tagsByType = {calc:{}, concept:{}, read:{}}; const conf = {sure:0, unsure:0, no:0, none:0};
  const dayMin = [];
  for (const s of DB.settings.subjects) S[s.id] = {min:0, days:0, intrN:0, intr:{early:0,mid:0,late:0}, errs:{calc:0,concept:0,read:0}, tags:{}, stuck:[], byDay:{}, errDay:{}, recOn:0};
  for (const d of days) {
    if (!dayHasData(d)) continue;
    recDays++;
    const dd = DB.days[d] || {subj:{}};
    let tot = 0;
    for (const sid in dd.subj) {
      const r = dd.subj[sid]; const x = S[sid]; if (!x) continue;
      x.byDay[d] = r;
      if (r.none) continue;
      x.recOn++;
      if (r.min > 0) { x.min += r.min; x.days++; tot += r.min; }
      if (r.intr && r.intr !== 'none') { x.intrN++; x.intr[r.intr]++; }
      if (r.stuck) x.stuck.push({d, sid, text:r.stuck});
    }
    if (tot) dayMin.push(tot);
    let e = 0;
    for (const it of itemsOn(d)) {
      const x = S[it.sid]; if (!x) continue;
      x.errs[it.type]++; e++; x.errDay[d] = (x.errDay[d]||0) + 1;
      conf[it.conf || 'none']++;
      for (const tg of splitTags(it.tag)) { x.tags[tg] = (x.tags[tg]||0) + 1; const key = tg+'｜'+subjById(it.sid).name; tagsByType[it.type][key] = (tagsByType[it.type][key]||0) + 1; }
    }
    errByDay[d] = e;
    if (dd.mood) mood[dd.mood].push(d);
  }
  const errs = {calc:0,concept:0,read:0};
  for (const sid in S) for (const t of ET) errs[t.k] += S[sid].errs[t.k];
  let redoN = 0, redoOk = 0;
  for (const it of allItems()) for (const h of (it.hist||[])) if (h.d >= from && h.d <= to) { redoN++; if (h.ok) redoOk++; }
  return {S, days, recDays, mood, errByDay, errs, errN: sum(Object.values(errs)), tagsByType, conf, from, to, dayMin, redoN, redoOk};
}

/* 观察发现：只描述模式不下判决；基准是孩子自己的锚点和上一周期 */
function findings(st, prev, anchors, nDays, monthly){
  const out = [];
  if (st.recDays === 0) return [{k:'info', t:'这段时间还没有记录。'}];
  if (st.recDays < Math.ceil(nDays * 4/7)) out.push({k:'info', t:`只记了 ${st.recDays} 天，下面的发现样本少，先当线索看，别当结论。`});
  for (const s of subjects(st.to)) {
    const x = st.S[s.id]; if (!x) continue;
    const a = anchors ? (anchors[s.id]||0) : 0;
    const avg = x.days ? x.min / x.days : 0;
    const intrRate = x.recOn ? x.intrN / x.recOn : 0;
    const eN = sum(Object.values(x.errs));
    const nm = `<b>${esc(s.name)}</b>`;
    if (a && x.days >= 3 && avg < a*0.7) {
      if (intrRate >= 0.4) {
        let t = `${nm} 平均每天 ${Math.round(avg)} 分钟，锚点 ${a} 分钟，少了 ${pct(a-avg,a)}%；${x.recOn} 天里 ${x.intrN} 天中途中断。用时短可能是卡住就换科，不一定是做得快。`;
        if (x.errs.concept >= Math.max(2, eN*0.4)) t += ` 这科错题又以<b>概念混淆</b>为主（${x.errs.concept}/${eN}），两个信号指向同一处：概念没弄懂时就停下了。`;
        out.push({k:'signal', t: t + ' 可以问：「做到哪一步开始想换别的？」'});
      } else if (eN <= 1) out.push({k:'good', t:`${nm} 平均 ${Math.round(avg)} 分钟，比锚点 ${a} 分钟少，没中断、错题也少，可能确实做得快。锚点先不动。`});
      else out.push({k:'info', t:`${nm} 平均 ${Math.round(avg)} 分钟，比锚点 ${a} 分钟少 ${pct(a-avg,a)}%，但很少中断。可能锚点定高了，也可能作业量少。`});
    } else if (x.days >= 3 && /数学/.test(s.name) && avg > 60) {
      out.push({k:'signal', t:`${nm} 平均每天 ${Math.round(avg)} 分钟。中国八年级的追踪研究里，数学作业时长和成绩是倒 U 形，最优约 45 分钟；超过 60 分钟更可能是卡住了，不是更努力。看看卡点记录。`});
    } else if (a && x.days >= 3 && avg > a*1.4) {
      out.push({k:'info', t:`${nm} 平均 ${Math.round(avg)} 分钟，超出锚点 ${a} 分钟 ${pct(avg-a,a)}%。是作业量大，还是卡住了？`});
    }
    if (x.intrN >= 2 && x.intr.early / x.intrN >= 0.6)
      out.push({k:'signal', t:`${nm} 的中断有 ${x.intr.early}/${x.intrN} 次在<b>前 15 分钟</b>。可能是启动困难：开头先放一道肯定能做对的小题，拿到一次小成功再往下。`});
  }
  if (st.dayMin.length >= 3) {
    const avgTot = sum(st.dayMin)/st.dayMin.length;
    if (avgTot > 90) out.push({k:'signal', t:`有记录的日子平均每天作业 ${Math.round(avgTot)} 分钟，超过教育部规定的初中书面作业 90 分钟上限。持续这样，建议和老师沟通作业量，不要先当成拖拉。`});
  }
  if (st.conf.sure >= 2) out.push({k:'info', t:`有 <b>${st.conf.sure} 道</b>是「做的时候有把握」却错了。研究发现这类错误改正后最不容易再犯，已排在重做队列最前面。`});
  if (st.errN >= 4) {
    const top = ET.map(t=>[t, st.errs[t.k]]).sort((a,b)=>b[1]-a[1])[0];
    if (top[1] / st.errN >= 0.5) {
      const tg = topEntries(st.tagsByType[top[0].k], 2).filter(e=>e[1]>=2);
      let t = `错题 ${st.errN} 道，其中<b>${top[0].n}</b> ${top[1]} 道（${pct(top[1],st.errN)}%）`;
      if (tg.length) t += `，集中在 ` + tg.map(e=>{ const p=e[0].split('｜'); return `${esc(p[1])}「${esc(p[0])}」${e[1]} 道`; }).join('、');
      if (top[0].k === 'concept') t += '。概念混淆光刷题没用，要回到课本例题把那个概念讲一遍。';
      else if (top[0].k === 'read') t += '。审题失误可以试试「圈条件」：做题前先把已知条件圈出来。';
      else t += monthly ? '。这三类分法没有经过研究验证，计算错误占大头时，抽两道和孩子确认：是真的算错，还是其实概念没懂。' : '。计算错误多，通常靠固定格式的小练习解决，不用加量。';
      out.push({k:'signal', t});
    }
  }
  { const cnt = {}; for (const it of allItems()) if (it.d >= st.from && it.d <= st.to && it.sub) { const k = it.sid + '|' + it.type + '|' + it.sub; cnt[k] = (cnt[k]||0) + 1; }
    for (const [k, n] of topEntries(cnt, 3)) { if (n < 3) continue; const [sid, type] = k.split('|'); const it = {sid, type, sub:k.split('|')[2]}; const tx = taxOf(sid);
      out.push({k:'signal', t:`<b>${esc(subjById(sid).name)}「${esc(subName(it))}」</b>出现 ${n} 次（${typeNameS(sid, type)}）。同一个具体问题反复出现，说明是知识漏洞而不是状态问题${tx && tx.next[type] ? '。下一步：' + esc(tx.next[type]) : ''}。`}); } }
  if (prev && prev.recDays >= 3 && st.recDays >= 3) {
    for (const t of ET) {
      const a = st.errs[t.k] / st.recDays * 7, b = prev.errs[t.k] / prev.recDays * 7;
      if (b >= 2 && a <= b * 0.5) out.push({k:'good', t:`<b>${t.n}</b>比上一段少了（按 7 天折算 ${b.toFixed(1)} → ${a.toFixed(1)} 道）。`});
      else if (a >= 3 && a >= b * 1.8 && a - b >= 2) out.push({k:'signal', t:`<b>${t.n}</b>比上一段多了（按 7 天折算 ${b.toFixed(1)} → ${a.toFixed(1)} 道）。先问是哪几道、卡在哪一步。`});
    }
  }
  if (st.redoN >= 3) out.push({k: st.redoOk/st.redoN >= 0.6 ? 'good' : 'info', t:`重做了 ${st.redoN} 次，做对 ${st.redoOk} 次（${pct(st.redoOk, st.redoN)}%）。` + (st.redoOk/st.redoN < 0.5 ? ' 重做正确率偏低，说明这些题的概念还没补上，先回课本，别急着再做。' : '')});
  const tired = st.mood.tired, others = st.days.filter(d => d in st.errByDay && !tired.includes(d));
  if (tired.length >= 2 && others.length >= 2) {
    const a = sum(tired.map(d=>st.errByDay[d]||0))/tired.length, b = sum(others.map(d=>st.errByDay[d]||0))/others.length;
    if (a >= 2 && a >= b * 1.5) out.push({k:'signal', t:`精神「困」的 ${tired.length} 天，平均每天错 ${a.toFixed(1)} 道，其他天 ${b.toFixed(1)} 道。先看睡眠，再看知识点。`});
  }
  const stuckN = sum(Object.values(st.S).map(x=>x.stuck.length));
  if (stuckN === 0 && st.recDays >= 3) out.push({k:'info', t:'卡点一条也没记。明晚试试只问一句：「哪一步最不确定？」孩子的回答本身就是诊断。'});
  if (!out.some(o=>o.k!=='info')) out.push({k:'good', t:'没有明显的异常信号。节奏稳住就是进展。'});
  return out;
}

/* ================= 错题重做队列 ================= */
function dueList(t){

  const pri = it => (it.conf === 'sure' ? 0 : it.conf === 'unsure' ? 1 : it.conf === 'no' ? 3 : 2);
  due.sort((a,b) => pri(a)-pri(b) || (a.due < b.due ? -1 : 1));
  // 交错：同一科目 / 知识点尽量不连着出
  const out = []; const pool = due.slice();
  while (pool.length) {

    let i = pool.findIndex(x => !last || (x.sid !== last.sid && x.tag !== last.tag));
    if (i < 0) i = 0; out.push(pool.splice(i,1)[0]);
  }

}

/* ================= 同步：WebCrypto 加密 → GitHub 私有仓库 ================= */
const b64e = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000)); return btoa(s); };
const b64d = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
async function gzip(bytes, inflate){
  const cs = inflate ? new DecompressionStream('gzip') : new CompressionStream('gzip');
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer());
}
async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptDB(obj, pass){
  let bytes = new TextEncoder().encode(JSON.stringify(obj)); const gz = typeof CompressionStream !== 'undefined';
  if (gz) bytes = await gzip(bytes);
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 210000;
  const key = await deriveKey(pass, salt, iter);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, bytes));
  return JSON.stringify({app:'observer', v:1, alg:'AES-GCM', kdf:'PBKDF2-SHA256', iter, gz, salt:b64e(salt), iv:b64e(iv), ct:b64e(ct)});
}
async function decryptDB(text, pass){
  const env = JSON.parse(text);
  const key = await deriveKey(pass, b64d(env.salt), env.iter);
  let bytes = new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(env.iv)}, key, b64d(env.ct)));
  if (env.gz) bytes = await gzip(bytes, true);
  return JSON.parse(new TextDecoder().decode(bytes));
}
/* 配置码：一台设备配好后复制给另一台（iPad 主屏幕 app 与 Safari 存储隔离，也靠它） */
const b64url = str => b64e(new TextEncoder().encode(str)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64url = str => { str = str.replace(/-/g,'+').replace(/_/g,'/'); while (str.length % 4) str += '='; return new TextDecoder().decode(b64d(str)); };
const makeSetupCode = () => 'OBS1.' + b64url(JSON.stringify(Object.assign({r:SYNC.repo, t:SYNC.token, p:SYNC.pass}, SYNC.exp ? {e:SYNC.exp} : {})));
function parseSetupCode(text){
  const m = String(text||'').match(/OBS1\.([A-Za-z0-9_-]+)/); if (!m) return null;
  try { const o = JSON.parse(unb64url(m[1])); return o.r && o.t && o.p ? Object.assign({repo:o.r, token:o.t, pass:o.p}, o.e ? {exp:o.e} : {}) : null; } catch(e) { return null; }
}
function applySetup(cfg){ SYNC = Object.assign({}, SYNC, cfg, {err:''}); saveSync(); return syncNow(true).then(render); }
const syncReady = () => !DEMO && SYNC.repo && SYNC.token && SYNC.pass;
function ghURL(){ return `https://api.github.com/repos/${SYNC.repo.trim()}/contents/${encodeURIComponent(SYNC.path || 'observer.enc.json')}`; }
const ghHeaders = accept => ({Authorization:'Bearer ' + SYNC.token.trim(), Accept: accept || 'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'});
async function ghPull(){
  const r = await fetch(ghURL() + '?t=' + now(), {headers: ghHeaders(), cache:'no-store'});
  if (r.status === 404) return {text:null, sha:null};
  if (r.status === 401 || r.status === 403) throw new Error('令牌无效、已过期，或没有这个仓库的权限');
  if (!r.ok) throw new Error('GitHub 返回 ' + r.status);
  const j = await r.json();
  let text = j.content ? new TextDecoder().decode(b64d(j.content.replace(/\n/g,''))) : null;
  if (!text) { const r2 = await fetch(ghURL() + '?t=' + now(), {headers: ghHeaders('application/vnd.github.raw+json'), cache:'no-store'}); text = await r2.text(); }
  return {text, sha:j.sha};
}
async function ghPush(text, sha){
  const body = {message:'observer sync ' + new Date().toISOString(), content: btoa(text)}; if (sha) body.sha = sha;
  const r = await fetch(ghURL(), {method:'PUT', headers: ghHeaders(), body: JSON.stringify(body)});
  if (r.status === 409 || r.status === 422) return 'conflict';
  if (!r.ok) throw new Error('上传失败：GitHub 返回 ' + r.status);
  return 'ok';
}
/* 同一天：各科记录按各自 u、当天字段按 fu 分别取新——两台设备同一天各填各的不会互相覆盖 */
function mergeDay(x, y){
  const clone = o => JSON.parse(JSON.stringify(o));
  const out = clone(x); out.fu = Object.assign({}, x.fu||{}); out.subj = Object.assign({}, x.subj||{});

      if (x && (!y || (x.u||0) > (y.u||0))) lN = true;
      if (y && (!x || (y.u||0) > (x.u||0))) { rN = true; out.push(clone(y)); } else out.push(clone(x));

    if (text) { try { remote = migrate(await decryptDB(text, SYNC.pass)); } catch(e) { throw new Error('口令不对，解不开云端数据'); } }
    let target = DB, push = !remote, changedLocal = false;

    if (push) {

      if (res === 'conflict') { syncing = false; if ((depth||0) < 2) return syncNow(manual, (depth||0)+1); throw new Error('云端同时被改动，请稍后再同步'); }

  let i = subs.findIndex(s => !filledRec(dd.subj[s.id])); if (i < 0) i = 0;
  state.wiz = {list: subs.map(s => s.id), i, step:'min'}; render();
}
function wizGo(step){ const w = state.wiz; if (step === 'next') { w.i++; w.step = 'min'; } else w.step = step; render(); const b = $('.wiz-body'); if (b) b.scrollTop = 0; }

    h += `<button class="wide soft ${r.none ? 'on' : ''}" data-act="wizmin" data-v="none">今天没有${esc(s.name)}作业</button></div>
      <div class="row" style="margin-top:16px;justify-content:center"><span class="small muted">都不对？</span><span class="stepper"><button data-act="wizadj" data-v="-5">−</button><span class="v">${r.min||0}′</span><button data-act="wizadj" data-v="5">+</button></span>${r.min ? '<button class="btn sm" data-act="wizmin" data-v="keep">就这么多</button>' : ''}</div>`;

      [['none','没停过','一口气做完'],['early','开头就停了','前 15 分钟'],['mid','做到中间停了',''],['late','快结束时停了','']].map(([k,n,sm]) => `<button data-act="wizintr" data-v="${k}">${n}${sm ? `<small>${sm}</small>` : ''}</button>`).join('') + `</div>

  } else if (w.step === 'sub') {
    const tx = taxOf(sid);

    foot += `<button class="btn primary" data-act="wiznext">${w.i + 1 < w.list.length ? '下一科' : '完成'}</button>`;

}
function stuckQ(name){
  if (/数学|物理|化学|科学/.test(name)) return '哪一步最不确定？';
  if (/语文/.test(name)) return '哪一句读不懂？哪道题最没把握？';
  if (/英语/.test(name)) return '哪个空选的时候最犹豫？';
  return '哪个地方最没把握？';
}
function tagList(sid){
  const set = {}; for (const it of DB.items) if (it.sid === sid) for (const t of splitTags(it.tag)) set[t] = (set[t]||0)+1;
  return `<datalist id="tags-${sid}">` + topEntries(set, 40).map(e=>`<option value="${esc(e[0])}">`).join('') + '</datalist>';
}

function periodRange(p){

    return [m >= 9 ? y+'-09-01' : m <= 1 ? (y-1)+'-09-01' : y+'-02-01', t, '本学期']; }

}

/* 中考口径：各科得分率 × 深圳中考满分（只算本次考了的、计入总分的科目） */
function zkRate(e){

  return full ? {got:Math.round(got), full, rate:Math.round(got/full*100)} : null;
}

function lineChart(series, xl, W, H){
  const L = 34, R = 14, T = 12, B = 28, n = xl.length;
  const X = i => L + (n === 1 ? (W-L-R)/2 : i*(W-L-R)/(n-1)), Y = v => T + (100 - v)*(H-T-B)/100;
  let s = `<svg class="chart" width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="考试得分率折线图">`;
  for (const g of [0,20,40,60,80,100]) s += `<line x1="${L}" x2="${W-R}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)" ${g===60?'stroke-dasharray="4 3"':''}/><text x="${L-6}" y="${Y(g)+4}" font-size="11" text-anchor="end">${g}</text>`;
  const step = Math.ceil(n / Math.max(1, Math.floor((W-L-R)/48)));
  xl.forEach((l,i) => { if (i % step === 0 || i === n-1) s += `<text x="${X(i)}" y="${H-8}" font-size="11" text-anchor="middle">${esc(l)}</text>`; });
  for (const se of series) {
    if (!se.pts.length) continue;
    s += `<polyline fill="none" stroke="${se.color}" stroke-width="${se.dash?1.6:2.2}" ${se.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round" points="${se.pts.map(p=>X(p.i)+','+Y(p.y)).join(' ')}"/>`;
    for (const p of se.pts) s += `<circle cx="${X(p.i)}" cy="${Y(p.y)}" r="${se.dash?2.5:3.5}" fill="${se.color}"><title>${esc(se.name)} ${xl[p.i]}：${p.v}（${Math.round(p.y)}%）</title></circle>`;
  }
  return s + `</svg>`;
}
function stackBars(groups, W, H, share, refLine){
  const L = 42, R = 8, T = 16, B = 24, n = groups.length;
  const bw = Math.min(40, (W-L-R)/n*0.62), gap = (W-L-R)/n;
  const max = share ? 100 : Math.max(refLine||10, ...groups.map(g => sum(g.parts.map(p=>p.v))));
  const niceMax = share ? 100 : Math.ceil(max/30)*30;
  const Y = v => T + (niceMax - v)*(H-T-B)/niceMax;
  let s = `<svg class="chart" width="100%" viewBox="0 0 ${W} ${H}" role="img">`;
  for (const g of (share ? [0,50,100] : [0, niceMax/2, niceMax])) s += `<line x1="${L}" x2="${W-R}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(g)+4}" font-size="11" text-anchor="end">${Math.round(g)}${share?'%':''}</text>`;
  if (refLine && !share) s += `<line x1="${L}" x2="${W-R}" y1="${Y(refLine)}" y2="${Y(refLine)}" stroke="var(--amber)" stroke-dasharray="5 4"/>`;
  groups.forEach((g, i) => {
    const x = L + gap*i + (gap-bw)/2; const tot = sum(g.parts.map(p=>p.v)); let acc = 0;
    for (const p of g.parts) { if (!p.v) continue; const v = share ? p.v/tot*100 : p.v; s += `<rect x="${x}" y="${Y(acc+v)}" width="${bw}" height="${Math.max(0, Y(acc)-Y(acc+v)-1)}" fill="${p.c}" rx="2"/>`; acc += v; }
    s += `<text x="${x+bw/2}" y="${H-7}" font-size="11" text-anchor="middle">${esc(g.label)}</text>`;
    if (tot) s += `<text x="${x+bw/2}" y="${Y(acc)-4}" font-size="10.5" text-anchor="middle">${share ? g.top : Math.round(tot)}</text>`;
  });
  return s + `</svg>`;
}

    <div class="row" style="margin-top:12px"><button class="btn primary" data-act="syncsave">保存并同步</button>${on ? '<button class="btn" data-act="syncnow">立即同步</button><button class="btn ghost danger" data-act="syncoff">关闭同步</button>' : ''}</div>
    <details style="margin-top:12px"><summary class="small muted">怎么拿到仓库和令牌（一次性，约 5 分钟）</summary><ol class="guide">
      <li>登录 github.com → 右上角「+」→ New repository，名字填 <b>observer-data</b>，选 <b>Private</b>，创建。</li>
      <li>头像 → Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token。</li>
      <li>Expiration 选 1 年；Repository access 选 <b>Only select repositories</b> → observer-data。</li>
      <li>Permissions → Repository permissions → <b>Contents</b> 选 Read and write，其他不动，生成后复制。</li>

  usesetup: () => { const cfg = parseSetupCode($('#sy-code').value); if (!cfg) return toast('配置码不对，要以 OBS1. 开头'); applySetup(cfg); },
  copysetup: () => { const code = makeSetupCode(); (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(() => toast('配置码已复制')).catch(() => prompt('复制这段配置码', code)); },
  copyweek: () => { const txt = weekSummary(state.week); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('本周小结已复制，可以粘贴到飞书')).catch(() => prompt('复制本周小结', txt)); },
  syncnow: () => { if (syncReady()) syncNow(true); else if (!DEMO) setTab('me'); },
  syncoff: () => { if (!confirm('关闭同步？本机数据保留，云端数据也保留。')) return; SYNC = {}; saveSync(); render(); },
  export: () => {
    flush(); const txt = JSON.stringify(Object.assign({}, DB, {timer:null}), null, 1);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type:'application/json'}));
    a.download = '每日观察备份-' + today() + '.json'; document.body.appendChild(a); a.click(); a.remove();
    if (!DEMO) { DB.settings.lastBackup = new Date().toISOString(); save(); }
    toast('已导出，把文件发到飞书私聊存档'); render();
  },
  copy: () => {
    const txt = JSON.stringify(Object.assign({}, DB, {timer:null}));
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => {
      if (!DEMO) { DB.settings.lastBackup = new Date().toISOString(); save(); } toast('已复制'); render();
    }).catch(() => { const t = $('#importt'); t.value = txt; t.closest('details').open = true; t.select(); toast('请手动全选复制'); });
  },
  importtext: () => importData($('#importt').value),
  wipe: () => { if (!confirm('清空本机数据？开了云同步的话，云端数据不受影响。')) return; if (!confirm('真的清空？建议先导出备份。')) return; DB = fresh(); pendingLocal = true; flush(); render(); },
};
function importData(txt){
  try {
    const x = migrate(JSON.parse(txt)); if (!x || !x.days || !x.settings) throw 0;
    if (!confirm(`备份里有 ${Object.keys(x.days).length} 天记录、${x.items.length} 道错题、${x.exams.length} 次考试。\n\n确定后会和本机数据合并（同一条记录取较新的）。`)) return;
    DB = mergeDB(DB, x).M; save(); toast('已合并导入'); render();
  } catch(e) { toast('这不是有效的备份'); }
}
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; const f = ACT[el.dataset.act]; if (f) { e.stopPropagation(); f(el, e); } });
document.addEventListener('input', e => {
  const el = e.target.closest('[data-in]'); if (!el) return;
  const k = el.dataset.in, f = el.dataset.f, v = el.value;
  if (k === 'day') setDayField(state.date, f, v);
  else if (k === 'rec') rec(state.date, el.dataset.s, true)[f] = v;
  else if (k === 'voice') { state.voice.text = v; const pv = $('#vqprev'); if (pv) pv.innerHTML = v ? speechPreview(parseSpeech(v, state.date)) : ''; return; }
  else if (k === 'item') { const it = DB.items.find(x => x.id === el.dataset.id); if (it) { it[f] = v; it.u = now(); } }
  else if (k === 'week') { const w = DB.weeks[state.week] = DB.weeks[state.week] || {}; w[f] = v; w.u = now(); }
  else if (k === 'anchor') { const w = DB.weeks[state.week] = DB.weeks[state.week] || {}; w.next = Object.assign({}, anchorsFor(state.week), w.next||{}); w.next[el.dataset.s] = Math.max(0, +v||0); w.u = now(); }
  else if (k === 'month') { const m = DB.months[state.month] = DB.months[state.month] || {}; m[f] = v; m.u = now(); }
  else if (k === 'set') { DB.settings[f] = f === 'startYear' ? (+v || 2026) : v; DB.settings.u = now(); }
  else if (k === 'sname') { const x = DB.settings.subjects.find(s => s.id === el.dataset.s); if (x && v.trim()) { x.name = v.trim(); DB.settings.u = now(); } }
  save();
});
document.addEventListener('change', e => {
  if (e.target.id === 'photoin' && e.target.files.length) { toast('正在压缩…'); addPhotos([...e.target.files]); return; }
  if (e.target.id === 'importf' && e.target.files[0]) { const r = new FileReader(); r.onload = () => importData(r.result); r.readAsText(e.target.files[0]); return; }
  if (e.target.closest('[data-in="set"],[data-in="sname"]')) renderChrome();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.wiz) { state.wiz = null; render(); } });
let rt; window.addEventListener('resize', () => { if (state.tab !== 'trends') return; clearTimeout(rt); rt = setTimeout(render, 200); });

/* ================= 示例数据（只在 ?demo 下生成，独立存储） ================= */
function seedDemo(){
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd()*a.length)];
  const t = today(), start = addD(t, -48);
  DB.settings.child = '小周';
  const act = ['yw','sx','yy','df','ls','dl','sw'];
  for (const d of range(start, t)) {
    if (rnd() < 0.12) continue;
    const dd = DB.days[d] = {subj:{}, mood: pick(['ok','ok','good','tired']), u:1};
    const wk = Math.floor(dayDiff(start, d) / 7);
    for (const sid of act) {
      if (['df','ls','dl','sw'].includes(sid) && rnd() < 0.5) { dd.subj[sid] = {none:true, min:0, intr:'none'}; continue; }
      const base = DB.settings.anchors[sid];
      let min = Math.round((base * (0.8 + rnd()*0.5))/5)*5, intr = 'none', stuck = '';
      const add = (type, tag, conf) => { const it = {id:uid('i'), d, sid, type, conf, tag, box:0, due:addD(d, BOXES[0]), hist:[], done:false, u:1};
        if (it.due < t && rnd() < 0.7) { const ok = rnd() < 0.65; it.hist.push({d:it.due, ok}); if (ok) { it.box = 1; it.due = addD(it.due, BOXES[1]); if (it.due < t && rnd() < 0.7) { it.hist.push({d:it.due, ok:true}); it.box = 2; it.due = addD(it.due, BOXES[2]); } } else it.due = addD(it.due, 1); }
        DB.items.push(it); };
      if (sid === 'sx') {
        const improving = wk >= 4;
        if (rnd() < (improving ? 0.25 : 0.6)) { intr = rnd() < 0.75 ? 'early' : 'mid'; min = Math.round(base*(0.45+rnd()*0.2)/5)*5; }
        if (rnd() < (improving ? 0.3 : 0.7)) add('concept', pick(['去括号','有理数混合运算','一元一次方程移项']), pick(['sure','unsure','no','no']));
        if (rnd() < 0.5) add('calc', pick(['有理数混合运算','负数乘方']), pick(['sure','unsure']));
        if (rnd() < 0.4) stuck = pick(['去括号的时候后面的项要不要变号','负数乘方那一步','移项不知道要不要变号','行程题不知道用相遇还是追及']);
      } else if (sid === 'yy') {
        if (rnd() < 0.4) add('read', pick(['完形填空','阅读理解']), pick(['sure','unsure']));
        if (rnd() < 0.3) add('concept', pick(['一般现在时三单','be动词']), 'unsure');
        if (rnd() < 0.2) stuck = '第 5 空在 which 和 that 之间犹豫';
      } else if (sid === 'yw') {
        if (rnd() < 0.35) add('read', pick(['阅读理解','古诗默写']), pick(['unsure','sure']));
        if (rnd() < 0.2) stuck = '说明方法那道题看不出是举例子还是列数字';
      } else if (rnd() < 0.15) add('concept', '', 'no');
      dd.subj[sid] = {min, intr, stuck};
    }
    if (rnd() < 0.3) dd.answer = pick(['数学第三题第二步','英语作文开头不会写','今天都还行','去括号那里']);
  }
  const m0 = monOf(start);
  DB.weeks[addD(m0,7)] = {found:'数学中断都在前15分钟，错题以概念混淆为主，卡在去括号', adjust:'数学开头先做 2 道会做的去括号小题', next:{sx:40}, u:1};
  DB.weeks[addD(m0,21)] = {found:'数学中断从 4 次降到 2 次', adjust:'锚点不动，继续观察', next:{sx:40}, u:1};
  DB.exams = [
    {id:'e1', date:addD(start,5), name:'开学摸底', type:'单元测验', scores:{yw:{s:88,full:120},sx:{s:52,full:100,loss:{calc:12,concept:26,read:10}},yy:{s:81,full:100}}, u:1},
    {id:'e2', date:addD(start,24), name:'第一单元测验', type:'单元测验', scores:{yw:{s:92,full:120},sx:{s:58,full:100,loss:{calc:10,concept:20,read:12}},yy:{s:84,full:100}}, u:1},
    {id:'e3', date:addD(start,40), name:'第一次月考', type:'月考', scores:{yw:{s:95,full:120},sx:{s:66,full:100,loss:{calc:10,concept:14,read:10}},yy:{s:83,full:100},df:{s:41,full:50},ls:{s:52,full:70}}, rankClass:'28', prep:['重做了错题','看了课本例题'], oneThing:'数学先做计算题，做完回头检查一遍符号', u:1},
  ];
  DB.emotions = [
    {id:'m1', date:addD(start,3), trigger:'同一题型重复犯错', level:5, paused:false, u:1},
    {id:'m2', date:addD(start,9), trigger:'看到走神', level:4, paused:false, u:1},
    {id:'m3', date:addD(start,20), trigger:'同一题型重复犯错', level:4, paused:true, u:1},
    {id:'m4', date:addD(start,33), trigger:'想到别人家孩子', level:3, paused:true, u:1},
    {id:'m5', date:addD(start,41), trigger:'说「我知道了」但在敷衍', level:4, paused:true, u:1},
  ];
  DB.v = 2;
}

/* ================= 启动 ================= */
(async function boot(){
  await load();
  await loadExt();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
  render();
  if (loadedFrom === 'legacy') { pendingLocal = true; flush(); }
  const hs = location.hash.match(/setup=(OBS1\.[A-Za-z0-9_-]+)/);
  if (hs && !DEMO) { history.replaceState(null, '', location.pathname + location.search); const cfg = parseSetupCode(hs[1]); if (cfg && confirm('用这个链接开启云同步？')) { state.tab = 'me'; await applySetup(cfg); return; } }
  if (syncReady()) syncNow();
})();
</script>
