<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>数学补漏计划 · 初一</title>
<style>
:root{
  --bg:#f4f2ee; --card:#fffefb; --ink:#23201c; --muted:#7b746a; --line:#e2ddd4;
  --accent:#2f6f8f; --accent-w:#e8f0f4; --good:#3d7a5a; --good-w:#e6f0ea;
  --warn:#9a7434; --warn-w:#f4eddd; --bad:#9c5050; --bad-w:#f3e5e3;
  --r:14px;
}
@media (prefers-color-scheme:dark){
:root{
  --bg:#191817; --card:#232120; --ink:#e9e5df; --muted:#9a938a; --line:#332f2d;
  --accent:#6ea8c4; --accent-w:#1e2b32; --good:#7bb394; --good-w:#1d2823;
  --warn:#c9a86a; --warn-w:#2c2620; --bad:#cf8f8f; --bad-w:#2e2222;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);
  padding:10px 12px 0;padding-top:calc(10px + env(safe-area-inset-top))}
h1{font-size:17px;margin:0 0 8px;font-weight:600;letter-spacing:.02em}
h1 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:1px solid var(--line);color:var(--muted);
  padding:7px 14px;border-radius:999px;font-size:15px;font-family:inherit;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:820px;margin:0 auto;padding:14px 12px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.dim{color:var(--muted)}
.card.note{border-left:3px solid var(--accent)}
.card.fin{opacity:.62}
h2{font-size:19px;margin:0 0 6px;font-weight:600}
p{margin:6px 0}
.sub{color:var(--muted);font-size:14.5px;line-height:1.55;margin-top:4px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.prog{flex:0 0 auto;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;padding-top:2px}
.btn{display:inline-block;margin-top:12px;background:var(--accent);color:#fff;border:none;
  border-radius:10px;padding:11px 20px;font-size:16px;font-family:inherit;cursor:pointer}
.btn:disabled{opacity:.4}
.btn.big{width:100%;padding:14px;font-size:17px}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line)}
.btn.danger{color:var(--bad)}
.mini{background:none;border:1px solid var(--line);color:var(--muted);border-radius:7px;
  padding:3px 9px;font-size:13px;font-family:inherit;cursor:pointer}
.tag{display:inline-block;background:var(--accent-w);color:var(--accent);font-size:13px;
  padding:3px 10px;border-radius:6px;margin-bottom:10px}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:8px}
.cnt{font-variant-numeric:tabular-nums}
.pbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:16px}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtext{font-size:22px;line-height:1.75;margin:10px 0 18px;font-weight:500}
.qtext sup{font-size:.62em;vertical-align:super}
input.ans{width:100%;font-size:24px;padding:12px 14px;border:1.5px solid var(--line);
  border-radius:10px;background:var(--bg);color:var(--ink);font-family:inherit;text-align:center}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px 0;
  font-size:21px;font-family:inherit;color:var(--ink);cursor:pointer;-webkit-user-select:none;user-select:none}
.k:active{background:var(--accent-w)}
.k.fn{font-size:15px;color:var(--muted)}
.k.go{background:var(--accent);color:#fff;border-color:var(--accent);font-size:17px}
.opts{display:grid;gap:9px}
.opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;
  padding:14px 16px;font-size:19px;font-family:inherit;color:var(--ink);cursor:pointer}
.opt.sel{border-color:var(--accent)}
.fb{margin-top:14px}
.fb.ok{border-top:1px solid var(--good);padding-top:12px}
.fb.no{border-top:1px solid var(--bad);padding-top:12px}
.fbhead{font-weight:600;font-size:17px}
.fb.ok .fbhead{color:var(--good)}
.fb.no .fbhead{color:var(--bad)}
.right{margin-top:4px}
.sol{margin:10px 0 0;padding-left:22px;color:var(--muted);font-size:15.5px}
.sol li{margin:5px 0}
.done{text-align:center;padding:22px 0}
.done b{font-size:19px}
.tb{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px}
.tb th{text-align:left;color:var(--muted);font-weight:500;font-size:13.5px;
  border-bottom:1px solid var(--line);padding:6px 8px 6px 0}
.tb td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tb tr.now td{background:var(--accent-w)}
.st{color:var(--muted);font-size:12px;margin-left:6px}
.pill{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:5px;
  background:var(--line);color:var(--muted)}
.pill.g{background:var(--good-w);color:var(--good)}
.pill.w{background:var(--warn-w);color:var(--warn)}
.pill.b{background:var(--bad-w);color:var(--bad)}
ol.q{margin:8px 0 0;padding-left:22px}
ol.q li{margin:6px 0}
.wq{border-top:1px solid var(--line);padding:10px 0}
.wqq{font-size:16.5px}
.wqa{color:var(--muted);font-size:13.5px;margin-top:3px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:9px 0;border-bottom:1px solid var(--line)}
.kv span{color:var(--muted);font-size:14.5px;flex:0 0 auto}
.kv input{flex:1 1 auto;max-width:200px;text-align:right;font-size:16px;padding:6px 10px;
  border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit}
.pask{background:var(--accent-w);border-radius:10px;padding:12px 14px;margin-top:12px}
.pask b{color:var(--accent);font-size:14px}
details{margin-top:10px}
summary{color:var(--accent);font-size:15px;cursor:pointer}
.chart{display:flex;align-items:flex-end;gap:4px;height:130px;margin:14px 0 4px}
.bar{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bar i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:0}
.bar span{font-size:9.5px;color:var(--muted);margin-top:4px;writing-mode:vertical-rl;letter-spacing:-.04em}
input.file{margin-top:8px;font-size:14px;color:var(--muted)}
.card.gain{border-left:3px solid var(--good)}
.grow{display:flex;align-items:baseline;gap:10px;margin-top:9px}
.grow i{flex:0 0 auto;font-style:normal;font-weight:600;color:var(--good);font-size:16px;
  background:var(--good-w);padding:2px 9px;border-radius:6px;font-variant-numeric:tabular-nums}
.grow span{font-size:15px;line-height:1.45}
.fact{margin-top:18px;padding:14px 16px;background:var(--accent-w);border-radius:12px}
.fact .ftag{font-size:12px;color:var(--accent);letter-spacing:.06em;margin-bottom:6px}
.fact b{font-size:17px;display:block;margin-bottom:6px}
.fact p{margin:0;font-size:15px;line-height:1.65;color:var(--ink)}
.card.boss{border-left:3px solid var(--warn)}
.lvtag{display:inline-block;margin-top:5px;font-size:12.5px;color:var(--warn);
  background:var(--warn-w);padding:2px 8px;border-radius:5px}
.miles{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.miles>div{flex:1 1 120px;background:var(--accent-w);border-radius:10px;padding:10px 12px}
.miles b{display:block;font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.miles span{font-size:12.5px;color:var(--muted);line-height:1.35;display:block;margin-top:2px}
.mile{font-size:13px;color:var(--warn);margin-top:4px;line-height:1.45}
.nw{white-space:nowrap;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.warnbar{background:var(--bad-w);color:var(--bad);padding:11px 14px;font-size:14.5px;line-height:1.5;
  border-bottom:1px solid var(--line)}
@media (min-width:700px){ .qtext{font-size:25px} .kb{max-width:420px} }
</style>
</head>
<body>
<header>
  <h1>数学补漏计划 <small>北师大版 · 七年级上</small></h1>
  <nav>
    <button class="tab on" data-t="today">今日</button>
    <button class="tab" data-t="diag">诊断</button>
    <button class="tab" data-t="plan">计划</button>
    <button class="tab" data-t="wrong">错题本</button>
    <button class="tab" data-t="parent">家长</button>
    <button class="tab" data-t="data">数据</button>
    <button class="tab" data-t="set">设置</button>
  </nav>
</header>
<main id="main"></main>
<script src="bank.js"></script>
<script src="app.js"></script>
</body>
</html>
