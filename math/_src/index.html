<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12161a">
<title>每天一站 · 初一数学</title>
<style>
/* ============================================================
   视觉系统
   结构隐喻：线路图。路线固定、站点清晰、你在哪一站、还差几站。
   数字是主角 → 题目走等宽栈，中文说明走黑体栈，混排即性格。
   错误不用红色 → 错题明天还会回来，那是「待返回的站」不是「失败」。
     红只留给清空数据这种真正破坏性的操作。
   ============================================================ */
:root{
  --bg:#eef2f5; --surface:#ffffff; --surface2:#e4eaef;
  --ink:#16202a; --ink2:#5a6b7a; --ink3:#8b9aa8;
  --line:#cdd8e0;
  --signal:#b8760c; --signal-bg:#fdf3e2;
  --go:#12796f;    --go-bg:#e2f2f0;
  --stop:#b8453a;  --stop-bg:#fbeae8;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --r:16px; --tabh:62px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12161a; --surface:#1a2026; --surface2:#232c34;
  --ink:#e7edf2; --ink2:#9dacb9; --ink3:#6d7d8b;
  --line:#2e3841;
  --signal:#f0a93b; --signal-bg:#2a2114;
  --go:#3fc3b4;    --go-bg:#132622;
  --stop:#ef7a6e;  --stop-bg:#2a1917;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}

.top{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  border-bottom:1px solid var(--line)}
.top .d{font-family:var(--mono);font-size:19px;font-weight:650;letter-spacing:-.03em}
.top .d i{font-family:var(--sans);font-size:13px;font-weight:400;font-style:normal;
  color:var(--ink2);margin:0 1px 0 1px}
.top .w{font-size:12px;color:var(--ink3);letter-spacing:.06em;margin-left:9px;font-family:var(--sans)}
.pbtn{font-size:12px;color:var(--ink3);letter-spacing:.06em;padding:5px 11px;
  border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.pbtn:active{background:var(--surface2)}

main{max-width:680px;margin:0 auto;padding:16px 16px calc(var(--tabh) + 26px + env(safe-area-inset-bottom))}
main.full{padding-bottom:calc(18px + env(safe-area-inset-bottom))}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--ink3);font-size:11px;letter-spacing:.06em}
.tabs button b{font-size:18px;line-height:1;font-weight:400;font-family:var(--mono)}
.tabs button.on{color:var(--signal)}
.tabs.hide{display:none}

.card{background:var(--surface);border-radius:var(--r);padding:18px;margin-bottom:14px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;color:var(--ink3);margin-bottom:12px}
.sub{color:var(--ink2);font-size:14px;line-height:1.55}
.mono{font-family:var(--mono)}

/* 线路：signature element */
.route{display:flex;margin:2px 0}
.stop{flex:1 1 0;position:relative;text-align:center;min-width:0}
.stop::before,.stop::after{content:'';position:absolute;top:10px;height:2px;background:var(--line)}
.stop::before{left:0;right:50%}
.stop::after{left:50%;right:0}
.stop:first-child::before,.stop:last-child::after{display:none}
.stop.done::before,.stop.done::after,.stop.now::before{background:var(--go)}
.stop i{position:relative;z-index:1;display:block;width:22px;height:22px;margin:0 auto;
  border-radius:50%;background:var(--surface);border:2px solid var(--line);
  transition:background .25s,border-color .25s}
.stop.done i{background:var(--go);border-color:var(--go)}
.stop.wait i{border-color:var(--signal);background:var(--signal-bg)}
.stop.now i{border-color:var(--signal);border-width:3px;box-shadow:0 0 0 5px var(--signal-bg)}
.stop b{display:block;font-size:12px;font-weight:500;margin-top:8px;color:var(--ink2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop em{display:block;font-family:var(--mono);font-size:11px;font-style:normal;
  color:var(--ink3);margin-top:1px}
.stop.now b{color:var(--signal);font-weight:650}
.stop.done b{color:var(--ink3)}
.weekbar{margin:2px 0 18px}
.weekbar .wt{font-size:13px;color:var(--ink2);margin-top:11px;line-height:1.5}
.route.mini .stop i{width:8px;height:8px;border-width:1.5px}
.route.mini .stop.now i{border-width:2px;box-shadow:0 0 0 3px var(--signal-bg)}
.route.mini .stop::before,.route.mini .stop::after{height:1.5px}
.route.mini .stop::before,.route.mini .stop::after{top:3px}
.route.mini .stop b{font-size:11px;margin-top:7px;font-weight:400}
.route.mini .stop.now b{font-weight:600}

.nowcard{background:var(--surface);border-radius:var(--r);padding:20px;margin-bottom:14px;
  border:1.5px solid var(--signal)}
.nowcard .k{font-size:11.5px;letter-spacing:.14em;color:var(--signal);margin-bottom:9px}
.nowcard h2{font-size:21px;margin-bottom:6px}
.nowcard .meta{font-family:var(--mono);font-size:13px;color:var(--ink3);margin-top:5px}
.go{display:block;width:100%;margin-top:17px;background:var(--signal);color:#fff;
  border-radius:12px;padding:15px;font-size:17px;font-weight:600;letter-spacing:.02em}
.go:active{transform:scale(.985)}
.go.sec{background:none;color:var(--signal);border:1.5px solid var(--line);font-weight:500}
.btn{display:inline-block;margin-top:12px;background:var(--surface2);color:var(--ink);
  border-radius:10px;padding:10px 18px;font-size:15px;font-weight:500}
.btn.pri{background:var(--signal);color:#fff}
.btn.danger{color:var(--stop);background:var(--stop-bg)}

.qwrap{display:flex;flex-direction:column;min-height:calc(100vh - 92px);
  min-height:calc(100dvh - 92px)}
.qbar{display:flex;align-items:center;gap:11px;padding:0 0 13px}
.qbar .back{font-family:var(--mono);font-size:20px;color:var(--ink3);padding-right:4px}
.qbar .nm{font-size:13px;color:var(--ink2);flex:1 1 auto;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbar .ct{font-family:var(--mono);font-size:13px;color:var(--ink3);flex:0 0 auto}
.dots{display:flex;gap:5px;padding-bottom:22px}
.dots i{flex:1 1 0;height:4px;border-radius:2px;background:var(--line);transition:background .3s}
.dots i.ok{background:var(--go)}
.dots i.no{background:var(--signal)}
.dots i.cur{background:var(--ink3)}
.qbody{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;
  padding:10px 0 76px;text-align:center}
.tag{display:inline-block;align-self:center;font-size:12px;letter-spacing:.05em;
  color:var(--signal);background:var(--signal-bg);padding:4px 12px;border-radius:999px;margin-bottom:22px}
.tag.plain{color:var(--ink3);background:var(--surface2)}
.q{font-family:var(--mono);font-size:34px;font-weight:600;line-height:1.5;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;word-break:break-word}
.q.mid{font-size:25px;line-height:1.55}
.q.long{font-size:19.5px;line-height:1.8;text-align:left;font-weight:400;font-family:var(--sans)}
.q.long b{font-family:var(--mono);font-weight:600}
.q sup{font-size:.58em;vertical-align:super}
.slot{margin:22px auto 0;min-width:190px;max-width:100%;padding:8px 24px 10px;
  border-bottom:3px solid var(--ink3);font-family:var(--mono);font-size:38px;
  font-weight:600;min-height:60px;transition:border-color .2s;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center}
.slot.has{border-color:var(--signal)}
.caret{display:inline-block;width:3px;height:38px;background:var(--signal);
  animation:blink 1.1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.hint{font-size:12.5px;color:var(--ink3);margin-top:11px;letter-spacing:.02em}
.opts{display:grid;gap:10px;margin-top:24px;text-align:left}
.opt{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;
  padding:16px 18px;font-family:var(--mono);font-size:18px;font-weight:500}
.opt:active{border-color:var(--signal)}

.pad{position:sticky;bottom:0;background:var(--bg);
  padding:10px 0 calc(8px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.pad button{background:var(--surface);border-radius:13px;padding:15px 0;
  font-family:var(--mono);font-size:23px;font-weight:500;box-shadow:0 1px 0 var(--line)}
.pad button:active{background:var(--surface2);transform:scale(.96)}
.pad .fn{font-family:var(--sans);font-size:14px;color:var(--ink2)}
.pad .ok{background:var(--signal);color:#fff;font-family:var(--sans);font-size:16px;font-weight:600}
.skip{display:block;width:100%;text-align:center;font-size:13.5px;color:var(--ink3);
  padding:13px 0 2px;text-decoration:underline;text-underline-offset:3px}

.fb{margin-top:22px;padding-top:17px;border-top:2px solid var(--line);text-align:left}
.fb.ok{border-color:var(--go)}
.fb.no{border-color:var(--signal)}
.fb .h{font-size:16px;font-weight:650;display:flex;align-items:baseline;gap:9px}
.fb.ok .h{color:var(--go)}
.fb.no .h{color:var(--signal)}
.fb .h .mk{font-family:var(--mono);font-size:19px}
.fb .ra{margin-top:9px;font-size:15px;color:var(--ink2)}
.fb .ra b{font-family:var(--mono);font-size:19px;color:var(--ink)}
.sol{margin:14px 0 0;padding-left:20px;color:var(--ink2);font-size:14.5px;line-height:1.7}
.sol li{margin:6px 0}
.pulse{animation:pulse .45s ease-out}
@keyframes pulse{0%{transform:scale(1)}35%{transform:scale(1.3)}100%{transform:scale(1)}}
.fadein{animation:fadein .22s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

.gains{background:var(--go-bg);border-radius:var(--r);padding:18px;margin-bottom:14px}
.gains .eyebrow{color:var(--go)}
.grow{display:flex;align-items:baseline;gap:13px;margin-top:11px}
.grow i{flex:0 0 auto;font-family:var(--mono);font-style:normal;font-weight:650;
  font-size:19px;color:var(--go);font-variant-numeric:tabular-nums;min-width:60px}
.grow span{font-size:14.5px;line-height:1.45}

.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.fc{background:var(--surface);border-radius:13px;padding:14px;min-height:102px;
  display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.fc .n{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.08em}
.fc .t{font-size:14.5px;font-weight:600;line-height:1.4;margin-top:9px}
.fc.lock{background:none;border:1.5px dashed var(--line)}
.fc.lock .t{color:var(--ink3);font-weight:400}
.fdetail{background:var(--signal-bg);border-radius:var(--r);padding:20px;margin-bottom:14px}
.fdetail .eyebrow{color:var(--signal)}
.fdetail h3{font-size:19px;margin-bottom:11px;line-height:1.4}
.fdetail p{margin:0;font-size:15px;line-height:1.75}

body.parent{--signal:#12796f;--signal-bg:#e2f2f0}
@media (prefers-color-scheme:dark){body.parent{--signal:#3fc3b4;--signal-bg:#132622}}
.pbanner{background:var(--surface2);border-radius:12px;padding:12px 15px;margin-bottom:16px;
  font-size:13.5px;color:var(--ink2);line-height:1.55}
.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{text-align:left;font-weight:500;font-size:11.5px;letter-spacing:.1em;color:var(--ink3);
  padding:0 8px 8px 0;border-bottom:1px solid var(--line)}
.tb td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tb tr.now td{background:var(--signal-bg)}
.tb .nw{font-family:var(--mono);font-size:12px;color:var(--ink3);white-space:nowrap}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:6px;
  background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.g{background:var(--go-bg);color:var(--go)}
.pill.w{background:#fdf3e2;color:#b8760c}
.pill.b{background:var(--stop-bg);color:var(--stop)}
@media (prefers-color-scheme:dark){.pill.w{background:#2a2114;color:#f0a93b}}
.mile{font-size:12.5px;color:#b8760c;margin-top:5px;line-height:1.45}
@media (prefers-color-scheme:dark){.mile{color:#f0a93b}}
.miles{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.miles>div{flex:1 1 110px;background:var(--surface2);border-radius:11px;padding:11px 13px}
.miles b{display:block;font-family:var(--mono);font-size:21px;font-weight:650}
.miles span{font-size:11.5px;color:var(--ink3);display:block;margin-top:2px;line-height:1.35}
ol.q2{margin:10px 0 0;padding-left:20px;font-size:14.5px;line-height:1.7}
ol.q2 li{margin:7px 0}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:11px 0;border-bottom:1px solid var(--line)}
.kv span{color:var(--ink2);font-size:14px;flex:0 0 auto}
.kv input{flex:1 1 auto;max-width:190px;text-align:right;font-family:var(--mono);font-size:15px;
  padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.pask{background:var(--signal-bg);border-radius:12px;padding:14px 16px;margin-top:14px}
.pask .k{font-size:11.5px;letter-spacing:.1em;color:var(--signal);margin-bottom:5px}
details{margin-top:12px}
summary{color:var(--signal);font-size:14.5px;cursor:pointer}
.wq{border-top:1px solid var(--line);padding:11px 0}
.wq .t{font-family:var(--mono);font-size:15px;line-height:1.5}
.wq .a{font-size:12.5px;color:var(--ink3);margin-top:4px;font-family:var(--mono)}
.chart{display:flex;align-items:flex-end;gap:3px;height:110px;margin:16px 0 6px}
.bar{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bar i{display:block;background:var(--signal);border-radius:2px 2px 0 0}
.bar b{font-family:var(--mono);font-size:8.5px;color:var(--ink3);font-weight:400;
  writing-mode:vertical-rl;margin-top:4px;letter-spacing:-.05em}
textarea.brief{width:100%;margin-top:12px;font-family:var(--mono);font-size:12px;line-height:1.55;
  padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);
  color:var(--ink);resize:vertical}
.pin{display:flex;gap:10px;justify-content:center;margin:20px 0 6px}
.pin i{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);display:block}
.pin i.on{background:var(--ink);border-color:var(--ink)}
.warnbar{background:var(--stop-bg);color:var(--stop);padding:11px 16px;font-size:13.5px;line-height:1.5}
.empty{text-align:center;padding:42px 20px;color:var(--ink3)}
.empty .mk{font-family:var(--mono);font-size:28px;display:block;margin-bottom:12px;color:var(--line)}

@media (min-width:620px){
  .q{font-size:42px}
  .pad{max-width:400px;margin:0 auto}
  .slot{font-size:44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main"></main>
<nav class="tabs" id="tabs"></nav>
<script src="bank.js"></script>
<script src="app.js"></script>
</body>
</html>
